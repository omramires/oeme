<style>
:root{--bg:#09090a;--card:#111113;--card2:#161618;--line:#232326;--txt:#f2f2f2;--mut:#9a9aa0;--green:#2fd67b;--gold:#e8c35a;--red:#ff4d4d}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(9,9,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px;gap:12px}
.brand{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo{width:22px;height:22px;border:1.5px solid var(--green);border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:11px}
nav{display:flex;gap:22px;font-size:13px;font-weight:700;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{padding:6px 0;white-space:nowrap;color:#e6e6e6}nav .on{color:var(--green)}
.tools{display:flex}
.ico{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:17px}
.ico:hover{background:var(--line)}
.badge{position:absolute;top:1px;right:1px;background:var(--green);color:#04170c;border-radius:9px;font-size:10px;font-weight:800;padding:1px 5px;line-height:1.3}
.searchbar{border-top:1px solid var(--line);padding:10px 0}
.search{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px}
.search input{flex:1;background:none;border:0;color:var(--txt);padding:12px 0;font:inherit;font-size:13px}

/* hero */
.hero{margin:16px 0 0;border:1px solid var(--line);border-radius:28px;padding:36px 20px 44px;text-align:center;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 60% 45% at 50% 0%,rgba(47,214,123,.10),transparent 70%),#0c0c0d}
.avatar{width:104px;height:104px;border-radius:50%;margin:0 auto;padding:3px;background:conic-gradient(var(--green),var(--gold),var(--green));display:grid;place-items:center}
.avatar>*{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#1b1b1e;display:grid;place-items:center;font-size:34px}
.hero h1{font-size:clamp(34px,7.6vw,84px);font-weight:800;letter-spacing:-.045em;line-height:1;margin:14px 0 22px;text-wrap:balance}
.panel{max-width:560px;margin:0 auto;background:#0f0f11;border:1px solid var(--line);border-radius:22px;padding:26px 24px 22px}
.combo-msg{color:var(--red);font-weight:800;font-size:13px;letter-spacing:.2px}
.combo-btn{margin:16px 0 10px;display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#04170c;font-weight:800;font-size:14px;border-radius:24px;padding:13px 26px;box-shadow:0 6px 22px rgba(47,214,123,.28)}
.combo-btn:active{transform:scale(.97)}
.panel small.t{display:block;color:var(--mut);font-size:11.5px}
.envios{margin-top:26px;font-weight:800;font-size:14px;letter-spacing:.3px}
.envios+div{color:var(--mut);font-size:12px;letter-spacing:2px;margin-top:5px}
.pagos-t{margin-top:26px;color:var(--gold);font-weight:800;font-size:14px;letter-spacing:2px}
.pagos-x{font-size:12px;color:#d0d0d4;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 20px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:20px;padding:8px 13px;font-size:12px;font-weight:700}
.pill b{color:var(--gold);font-weight:800}
.refs{border-top:1px solid var(--line);padding-top:22px;display:grid;grid-template-columns:1.3fr 1fr;gap:12px 20px;text-align:center}
.refs h4{font-size:11px;letter-spacing:2.4px;color:var(--mut);font-weight:800;margin-bottom:14px}
.refs p{font-size:12px;font-weight:700;line-height:1.9}
.refs .tel{color:var(--green);font-weight:600}
.site{margin-top:22px;font-size:11px;letter-spacing:3px;color:var(--mut)}
@media(max-width:560px){.refs{grid-template-columns:1fr}.panel{padding:22px 16px}}

/* sections / rows */
.sh{display:flex;align-items:baseline;gap:10px;margin:40px 0 14px;flex-wrap:wrap}
.sh h2{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.04em}
.sh h2 i{color:var(--green);font-style:normal}
.sh .sb{font-size:12px;color:var(--mut);font-weight:600}
.sh .go{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--green)}
.arrow{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--txt);font-size:13px}
.arrow:hover{border-color:var(--green);color:var(--green)}
.rowx{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:none}
.rowx::-webkit-scrollbar{display:none}
.rowx .card{flex:0 0 clamp(236px,24vw,262px);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

/* card */
.card{background:#101012;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.imgwrap{position:relative;margin:14px 14px 0}
.imgbox{width:100%;aspect-ratio:1/.72;display:grid;place-items:center;overflow:hidden;border-radius:6px;background:#fff;cursor:zoom-in}
.imgbox img{width:100%;height:100%;object-fit:contain}
.imgbox.ph{background:#1a1b1d;cursor:default}
.ph span{font-size:36px;opacity:.5}
.fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(9,9,10,.9);border:1px solid var(--line);z-index:2;display:grid;place-items:center;font-size:14px;color:#fff}
.fav.on{color:#ff5470}.fav.on svg{fill:#ff5470}
.zoom{position:absolute;right:6px;bottom:6px;width:22px;height:22px;background:rgba(0,0,0,.78);border-radius:6px;color:#fff;display:grid;place-items:center;font-size:11px;z-index:2}
.info{border-top:1px solid var(--line);margin-top:14px;padding:14px;display:flex;flex-direction:column;flex:1}
.name{font-weight:800;font-size:14px;line-height:1.3;min-height:37px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lbl{font-size:9.5px;letter-spacing:1.8px;color:var(--mut);font-weight:800;text-transform:uppercase}
.big{font-size:25px;font-weight:800;color:var(--green);letter-spacing:-.03em;margin-top:2px;line-height:1.15}
.ars{font-size:12px;font-weight:700;color:var(--gold);margin-top:6px}
.mayo{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.tier{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:12px;font-weight:600}
.tier:first-of-type{border-top:0}
.tier div{text-align:right;color:var(--green);font-weight:800;font-size:13px;line-height:1.25}
.tier div span{display:block;color:var(--gold);font-size:10.5px;font-weight:700}
.combo-note{font-size:10.5px;color:var(--gold);font-weight:700;margin-top:4px}
.nomayo{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:11px;color:var(--mut);font-weight:600}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:14px}
.add{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--green);color:#04170c;font-weight:800;font-size:13px;border-radius:12px;padding:11px;box-shadow:0 4px 14px rgba(47,214,123,.18)}
.add:active{transform:scale(.97)}
.add:disabled{background:var(--line);color:var(--mut);cursor:not-allowed;box-shadow:none}
.wa{width:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:16px;flex:none}
.wa:hover{border-color:var(--green)}

/* galería */
.veil2{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:40;display:grid;place-items:center;padding:14px;overflow:auto}
.gal{width:min(980px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1.4fr 1fr;position:relative}
.gal .gx{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(9,9,10,.9);border:1px solid var(--line);display:grid;place-items:center;z-index:3}
.gleft{padding:18px;background:#0c0c0e}
.gmain{position:relative;background:#fff;border-radius:12px;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.gmain img{width:100%;height:100%;object-fit:contain}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(9,9,10,.85);color:#fff;display:grid;place-items:center;font-size:18px}
.gnav.l{left:10px}.gnav.r{right:10px}
.gthumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.gthumbs button{aspect-ratio:1/1;background:#fff;border:2px solid var(--line);border-radius:9px;overflow:hidden;padding:0}
.gthumbs button.on{border-color:var(--green)}
.gthumbs img{width:100%;height:100%;object-fit:contain}
.gcount{position:absolute;left:10px;bottom:10px;background:rgba(9,9,10,.8);border-radius:10px;font-size:11px;font-weight:800;padding:3px 9px}
.gright{padding:26px 24px;display:flex;flex-direction:column;overflow:auto;max-height:90vh}
.gright h2{font-size:20px;font-weight:800;line-height:1.25;padding-right:36px}
.gright .big{font-size:30px;margin-top:6px}
@media(max-width:760px){.gal{grid-template-columns:1fr}.gright{max-height:none}}

/* views */
.vh{margin:22px 0 4px}
.vh h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.045em;display:inline}
.vh h1 i{color:var(--green);font-style:normal}
.vh .sb{font-size:13px;color:var(--mut);font-weight:600;margin-left:10px}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:8px 16px;font-size:12.5px;font-weight:800}
.chip:hover{border-color:#3a3a3f}
.chip.b{border-color:var(--gold);color:var(--gold);background:#1c180b}
.chip.s{border-color:var(--green);color:var(--green);background:#0b1c13}
.vg{margin:0}
.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.csearch{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#0f0f11;border-radius:16px;padding:0 16px;margin:16px 0 14px;color:var(--mut)}
.csearch input{flex:1;background:none;border:0;color:var(--txt);padding:14px 0;font:inherit;font-size:13.5px}
.csearch input:focus-visible{outline:none}
.csearch:focus-within{border-color:var(--green)}
.gh{display:flex;align-items:center;gap:10px;margin:24px 0 14px;color:var(--gold);font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:15px}
.gh span{color:var(--mut);font-size:12px;font-weight:700;letter-spacing:0}
.gh:after{content:"";flex:1;height:1px;background:var(--line)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0;font-size:14px}
.warn{background:#1c180b;border:1px solid var(--gold);color:var(--gold);font-size:12px;padding:10px 14px;border-radius:10px;margin:14px 0 0}

/* footer */
.aviso{text-align:center;margin:54px 0 30px}
.aviso p{color:var(--red);font-size:11px;font-weight:800;letter-spacing:2.6px}
.aviso h3{font-size:clamp(22px,3.4vw,28px);font-weight:800;letter-spacing:.12em;margin-top:6px}
.aviso em{display:block;color:var(--mut);font-size:12px;margin-top:6px}
footer{border-top:1px solid var(--line);padding:34px 0 120px;margin-top:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px}
.fgrid h5{font-size:10.5px;letter-spacing:2.2px;color:var(--mut);font-weight:800;margin-bottom:14px}
.fgrid a,.fgrid button{display:block;font-size:12.5px;font-weight:600;margin-bottom:9px;color:#dcdce0;text-align:left}
.fgrid a:hover,.fgrid button:hover{color:var(--green)}
.fbrand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.fbrand+p{color:var(--mut);font-size:11.5px;margin-top:10px;letter-spacing:.5px}
.copy{margin-top:26px;font-size:11px;color:var(--mut)}
@media(max-width:700px){.fgrid{grid-template-columns:1fr 1fr}.fgrid>div:first-child{grid-column:1/-1}}

/* floating */
.fab{position:fixed;right:18px;bottom:18px;display:flex;align-items:center;gap:10px;z-index:15}
.fab span{background:#fff;color:#0b0b0c;font-weight:800;font-size:12px;padding:9px 14px;border-radius:20px}
.fab a{width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.cartfab{position:fixed;left:18px;bottom:18px;z-index:15;width:56px;height:56px;border-radius:50%;background:var(--gold);color:#241b00;display:grid;place-items:center;font-size:24px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.cartfab .badge{background:var(--red);color:#fff;top:-2px;right:-2px}

/* cart drawer */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(449px,100%);background:#0a0a0b;border-left:1px solid var(--line);z-index:31;display:flex;flex-direction:column;animation:in .2s ease-out}
@keyframes in{from{transform:translateX(30px);opacity:0}}
@media(prefers-reduced-motion:reduce){.drawer{animation:none}html{scroll-behavior:auto}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h2{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.dh h2 svg{font-size:17px}
.dh h2 small{font-size:13px;color:var(--mut);font-weight:700;letter-spacing:0}
.dh .cl{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#161618;display:grid;place-items:center}
.dl{flex:1;overflow:auto;padding:18px 20px}
.citem{border:1px solid var(--line);background:#121214;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.ct{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ct b{font-size:14.5px;font-weight:800;line-height:1.3}
.ct button{color:var(--mut);font-size:15px;padding:2px}
.cm{display:flex;justify-content:space-between;align-items:flex-start;margin-top:10px;gap:10px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);background:#1a1a1c;border-radius:20px;overflow:hidden}
.qty button{width:40px;height:38px;font-size:17px;font-weight:700;display:grid;place-items:center}
.qty button:hover{background:#242427}
.qty span{min-width:50px;height:38px;display:grid;place-items:center;font-weight:800;font-size:15px;background:#0a0a0b}
.cp{text-align:right}
.cp strong{display:block;color:var(--green);font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.cp em{font-style:normal;color:var(--gold);font-weight:800;font-size:13px}
.cdet{font-size:11.5px;color:#c9c9ce;margin-top:10px;line-height:1.5}
.cdet b{color:var(--gold);font-weight:800;font-size:11.5px}
.hint{margin-top:10px;background:#0f2118;border:1px solid #17361f;color:var(--green);font-size:11.5px;font-weight:700;border-radius:10px;padding:9px 12px}
.sec{margin:26px 0 12px;font-size:12px;letter-spacing:2.4px;color:#b9b9bf;font-weight:800}
.fi{width:100%;background:#151517;border:1px solid var(--line);border-radius:14px;padding:15px 16px;color:var(--txt);font:inherit;font-size:14px;margin-bottom:12px;display:block}
.fi::placeholder{color:#6f6f76}
textarea.fi{resize:vertical;min-height:84px}
.fi:focus-visible{outline:none;border-color:var(--green)}
.df{padding:16px 20px 18px;border-top:1px solid var(--line);background:#0a0a0b}
.tot{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.tot>span{font-weight:800;font-size:14px;color:#c9c9ce;padding-top:6px}
.tot div{text-align:right}
.tot em{display:block;font-style:normal;color:var(--green);font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tot small{color:var(--gold);font-weight:800;font-size:14px}
.send{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#25d366;color:#04170c;font-weight:800;font-size:15px;padding:16px;border-radius:14px}
.send:disabled{background:#1e1e20;color:#6b6b72;cursor:not-allowed}
.note{font-size:11.5px;color:var(--mut);margin-top:12px;text-align:center}
.ok{text-align:center;padding:60px 24px}
.ok h3{font-size:22px;margin:12px 0 8px}
.ok p{color:var(--mut);font-size:13px}
</style>
</head>

const usd=n=>"USDT $"+Number(n).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const ars=n=>"$"+Math.round(n).toLocaleString("es-AR");
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const usePersist=(k,init)=>{const [v,set]=useState(()=>{try{return JSON.parse(localStorage.getItem(k))??init}catch{return init}});
  useEffect(()=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},[v]);return [v,set]};

/* Normaliza un producto de la base: tramos ordenados, fotos (máx. 6) y precios en pesos */
function shape(r,cot){
  /* producto en pesos: el precio en pesos es el real y el USDT se calcula con la cotización del día */
  const nat=r.moneda==="ARS"&&cot>0&&Number(r.precio_ars)>0;
  const p=nat?Number(r.precio_ars)/cot:(Number(r.precio_usdt)||0), pa=Number(r.precio_ars)||Math.round(p*cot);
  const t=(r.tramos||[]).map(x=>{const a=Number(x.ars);return {min:Number(x.min),usdt:nat&&a>0?a/cot:Number(x.usdt),ars:a||Math.round(Number(x.usdt)*cot)}})
    .filter(x=>x.min>0&&x.usdt>0).sort((a,b)=>a.min-b.min);
  const imgs=((r.imagenes&&r.imagenes.length)?r.imagenes:(r.imagen_url?[r.imagen_url]:[])).filter(Boolean).slice(0,6);
  return {id:r.id,nombre:r.nombre,categoria:r.categoria,marca:r.marca||"",subcategoria:r.subcategoria||"",imgs,
    grupo:(r.grupo_combinado||"").trim(),p,pa,t,stock:r.stock==null?null:Number(r.stock)};
}

function unit(prod,tq){let u=[prod.p,prod.pa],tier=null;prod.t.forEach(t=>{if(tq>=t.min){u=[t.usdt,t.ars];tier=t}});return {u:u[0],a:u[1],tier}}

const EMPTY_ENVIO={empresa:"",nombre:"",dni:"",cp:"",localidad:"",direccion:""};
function Cart({cart,setCart,products,close,S,wa}){
  const [f,setF]=usePersist("envio",EMPTY_ENVIO);
  const [busy,setBusy]=useState(false),[done,setDone]=useState(null),[err,setErr]=useState("");
  const set=(k,v)=>setF(x=>({...EMPTY_ENVIO,...x,[k]:v}));
  const base=cart.map(c=>{const p=products.find(x=>x.id===c.id);return p?{p,q:c.q}:null}).filter(Boolean);
  // las unidades de productos del mismo grupo (ej: "Audio") se suman para llegar al tramo
  const groupQ={};base.forEach(l=>{if(l.p.grupo)groupQ[l.p.grupo]=(groupQ[l.p.grupo]||0)+l.q});
  const lines=base.map(l=>{const tq=l.p.grupo?groupQ[l.p.grupo]:l.q;const r=unit(l.p,tq);
    const next=l.p.t.find(t=>t.min>tq&&t.usdt<r.u);return {...l,tq,...r,next}});
  const totU=lines.reduce((s,l)=>s+l.u*l.q,0),totA=lines.reduce((s,l)=>s+l.a*l.q,0),units=lines.reduce((s,l)=>s+l.q,0);
  const setQ=(id,d)=>setCart(cs=>cs.map(c=>c.id===id?{...c,q:c.q+d}:c).filter(c=>c.q>0));
  const rm=id=>setCart(cs=>cs.filter(c=>c.id!==id));
  const ready=lines.length>0&&["nombre","dni","cp","localidad","direccion"].every(k=>(f[k]||"").trim());

  const send=async()=>{
    setBusy(true);setErr("");
    const w=window.open("","_blank");               // se abre ya para que el navegador no lo bloquee
    let num=null,saved=false;
    if(db){
      const {data,error}=await db.rpc("crear_pedido",{
        p_envio:{empresa:(f.empresa||"").trim(),nombre:f.nombre.trim(),dni:f.dni.trim(),cp:f.cp.trim(),localidad:f.localidad.trim(),direccion:f.direccion.trim()},
        p_nota:"",p_items:lines.map(l=>({producto_id:l.p.id,cantidad:l.q}))});
      if(error){setErr("No pudimos registrar el pedido en el sistema, pero igual lo enviamos por WhatsApp.")}
      else{num=data.numero;saved=true}
    }
    const txt=[`*Nuevo pedido${num?` #${num}`:""} - ${S.tienda}*`,"",
      ...lines.map(l=>`• ${l.q} x ${l.p.nombre}\n   ${usd(l.u)} c/u (${ars(l.a)}) = ${usd(l.u*l.q)}`),"",
      `*Total: ${usd(totU)}* (${ars(totA)})`,"",`*Datos de envío*`,
      f.empresa?`Empresa: ${f.empresa}`:"",`Nombre: ${f.nombre}`,`DNI: ${f.dni}`,`CP: ${f.cp}`,`Localidad: ${f.localidad}`,`Dirección/Sucursal: ${f.direccion}`]
      .filter((x,i,a)=>x!==""||(a[i-1]!==""&&i>0)).join("\n");
    const url=wa(txt);
    if(w) w.location.href=url; else window.location.href=url;
    setBusy(false);
    if(saved||!db){setCart([]);setDone(num||true)}
  };

  return (<>
    <div className="veil" onClick={close}/>
    <aside className="drawer" role="dialog" aria-label="Tu pedido">
      <div className="dh"><h2><Ic n="cart"/>Tu pedido{units>0&&<small>· {units} u</small>}</h2><button className="cl" onClick={close} aria-label="Cerrar"><Ic n="x"/></button></div>
      {done?<div className="ok"><div style={{fontSize:44,color:"var(--green)"}}><Ic n="check"/></div>
          <h3>{done===true?"Pedido enviado":`Pedido #${done} registrado`}</h3>
          <p>Te esperamos en WhatsApp para confirmar el pedido.</p>
          <button className="send" style={{marginTop:24}} onClick={close}>Seguir viendo productos</button></div>
      :<>
      <div className="dl">
        {lines.length===0&&<p className="empty" style={{padding:"40px 0",textAlign:"center",color:"var(--mut)"}}>Todavía no agregaste productos.</p>}
        {lines.map(l=>(<div className="citem" key={l.p.id}>
          <div className="ct"><b>{l.p.nombre}</b><button onClick={()=>rm(l.p.id)} aria-label={`Quitar ${l.p.nombre}`}><Ic n="x"/></button></div>
          <div className="cm">
            <div className="qty"><button aria-label="Quitar uno" onClick={()=>setQ(l.p.id,-1)}>−</button><span>{l.q}</span><button aria-label="Agregar uno" onClick={()=>setQ(l.p.id,1)}>+</button></div>
            <div className="cp"><strong>{usd(l.u*l.q)}</strong><em>{ars(l.a*l.q)}</em></div>
          </div>
          <div className="cdet">{usd(l.u)} c/u{l.tier&&` · tramo x${l.tier.min}`}{l.p.grupo&&<> · <b>combinado {l.p.grupo} ({l.tq} u)</b></>}</div>
          {l.next&&<div className="hint">Sumá {l.next.min-l.tq} u más{l.p.grupo?` de ${l.p.grupo}`:""} y bajás a {usd(l.next.usdt)} c/u</div>}
        </div>))}

        {lines.length>0&&<>
          <div className="sec">DATOS DE ENVÍO</div>
          <input className="fi" placeholder="Empresa de envío (Andreani, Vía Cargo...)" value={f.empresa||""} onChange={e=>set("empresa",e.target.value)}/>
          <input className="fi" placeholder="Nombre y apellido *" value={f.nombre||""} onChange={e=>set("nombre",e.target.value)} autoComplete="name"/>

          <textarea className="fi" placeholder="Dirección completa / Sucursal *" value={f.direccion||""} onChange={e=>set("direccion",e.target.value)} autoComplete="street-address"/>
          {err&&<div className="warn" style={{margin:"0 0 6px"}}>{err}</div>}
        </>}
      </div>
      <div className="df">
        <div className="tot"><span>Total</span><div><em>{usd(totU)}</em><small>{ars(totA)}</small></div></div>
        <button className="send" disabled={!ready||busy} onClick={send}><WaSvg s={20} c="currentColor"/>{busy?"Enviando…":"Enviar pedido por WhatsApp"}</button>
        {!ready&&<p className="note">Completá los datos marcados con * para enviar.</p>}
      </div>
      </>}
    </aside>
  </>);
}

    title=cat.nombre;subt=cat.subtitulo||"Precio minorista y tramos mayoristas por cantidad.";
  }
  const brands=[...new Set(inCatAll.map(p=>p.marca).filter(Boolean))];
  const subs=[...new Set(inCatAll.filter(p=>!brand||p.marca===brand).map(p=>p.subcategoria).filter(Boolean))];
  const examples=[...new Set(inCatAll.slice(0,12).map(p=>p.nombre.split(/\s+/).slice(0,2).join(" ")))].slice(0,3).join(", ");
  // en la vista de sección los productos se agrupan por subcategoría (como "CELULARES (26)")
  const groups=mode==="cat"?Object.entries(list.reduce((m,p)=>{const k=p.subcategoria||"Otros";(m[k]=m[k]||[]).push(p);return m},{})):[];

  return (<>
    <header>
      <div className="wrap bar">
        <button className="brand" onClick={()=>nav("home")}><span className="logo">◎</span>{S.tienda.toUpperCase()}</button>
        <nav aria-label="Secciones">
          <button className={mode==="home"?"on":""} onClick={()=>nav("home")}>Inicio</button>
          {cats.map(c=><button key={c.slug} className={cat&&cat.slug===c.slug&&!searching?"on":""} onClick={()=>nav(c.slug)}>{c.nombre}</button>)}
        </nav>
        <div className="tools">
          <button className="ico" aria-label="Buscar en toda la tienda" onClick={()=>setSearchOpen(!searchOpen)}><Ic n="search"/></button>
          <button className="ico" aria-label="Favoritos" onClick={()=>nav("favs")} style={mode==="favs"?{color:"#ff5470"}:null}><Ic n="heart"/>{favs.length>0&&<span className="badge">{favs.length}</span>}</button>
          <button className="ico" aria-label="Carrito" onClick={()=>setOpen(true)}><Ic n="bag"/>{count>0&&<span className="badge">{count}</span>}</button>
        </div>
      </div>
      {searchOpen&&<div className="searchbar"><div className="wrap"><label className="search"><Ic n="search"/>
        <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar en toda la tienda (ej: AirPods, Realme, Lattafa)…"/></label></div></div>}
    </header>

    <main className="wrap">
      {status==="demo"&&<div className="warn">Mostrando datos de ejemplo. Completá <b>config.js</b> con tu URL y anon key de Supabase.</div>}
      {status==="error"&&<div className="warn">No se pudo leer la base de datos. Revisá <b>config.js</b> y que hayas ejecutado <b>supabase.sql</b>. Se muestran datos de ejemplo.</div>}
      {status==="load"&&<p className="empty" style={{padding:"80px 0"}}>Cargando catálogo…</p>}

      {status!=="load"&&mode==="home"&&<>
        <Hero S={S} wa={wa}/>
        {cats.map(c=>{const items=products.filter(p=>p.categoria===c.slug);
          return items.length?<Row key={c.slug} cat={c} items={items} onAll={()=>nav(c.slug)} favs={favs} {...common}/>:null})}
        {products.length===0&&<p className="empty">Todavía no hay productos cargados.</p>}
      </>}

      {status!=="load"&&mode!=="home"&&<>
        <div className="vh"><h1>{title}<i>.</i></h1><span className="sb">{subt}</span></div>
        {mode==="cat"&&<>
          <label className="csearch"><Ic n="search"/>
            <input value={cq} onChange={e=>setCq(e.target.value)} aria-label={`Buscar en ${cat.nombre}`}
              placeholder={`Buscar en ${cat.nombre.toLowerCase()}${examples?` (ej: ${examples})`:""}...`}/></label>
          {brands.length>0&&<div className="fchips">{brands.map(b=><button key={b} className={"chip"+(brand===b?" b":"")} onClick={()=>{setBrand(brand===b?null:b);setSub(null)}}>{b}</button>)}</div>}
          {subs.length>0&&<div className="fchips"><button className={"chip"+(!sub?" s":"")} onClick={()=>setSub(null)}>Todos</button>
            {subs.map(s=><button key={s} className={"chip"+(sub===s?" s":"")} onClick={()=>setSub(sub===s?null:s)}>{s}</button>)}</div>}
        </>}
        {mode==="cat"&&list.length>0?groups.map(([g,items])=>(<section key={g}>
            {(groups.length>1||g!=="Otros")&&<h2 className="gh">{g}<span>({items.length})</span></h2>}
            <div className="grid vg" style={groups.length===1&&g==="Otros"?{marginTop:18}:null}>{items.map(cardOf)}</div></section>))
         :<div className="grid vg" style={{marginTop:18}}>
          {list.length===0?<p className="empty">{mode==="favs"?"Todavía no marcaste favoritos.":"No encontramos productos. Probá con otra búsqueda o quitá los filtros."}</p>:list.map(cardOf)}
        </div>}
      </>}

      <div className="aviso"><p>{S.pie_aviso}</p><h3>{S.pie_marca}</h3><em>{S.pie_autor}</em></div>
    </main>

    <footer><div className="wrap">
      <div className="fgrid">
        <div><div className="fbrand"><span className="logo">◎</span>{S.tienda.toUpperCase()}</div><p>{(cats[0]&&(cats[0].titulo_home||cats[0].nombre)||"").toUpperCase()}</p></div>
        <div><h5>SECCIONES</h5><button onClick={()=>nav("home")}>Inicio</button>{cats.map(c=><button key={c.slug} onClick={()=>nav(c.slug)}>{c.nombre}</button>)}</div>
        <div><h5>COMPRAR</h5>
          {S.listas_pdf_url&&<a href={S.listas_pdf_url} target="_blank" rel="noreferrer">Listas en PDF</a>}
          <a href={wa("Hola! Quisiera hacer una consulta.")} target="_blank" rel="noreferrer">WhatsApp</a>
          {S.sitio&&(S.sitio_url?<a href={S.sitio_url} target="_blank" rel="noreferrer">{S.sitio.toLowerCase()}</a>:<span style={{fontSize:12.5,fontWeight:600}}>{S.sitio.toLowerCase()}</span>)}
        </div>
      </div>
      <p className="copy">© {new Date().getFullYear()} {S.tienda.toUpperCase()}. Todos los derechos reservados.</p>
    </div></footer>

    <button className="cartfab" aria-label="Abrir carrito" onClick={()=>setOpen(true)}><Ic n="cart"/>{count>0&&<span className="badge">{count}</span>}</button>
    <div className="fab"><span>Escribinos</span><a href={wa("Hola! Quisiera hacer una consulta.")} target="_blank" rel="noreferrer" aria-label="WhatsApp"><WaSvg/></a></div>

    {zoomP&&<Gallery p={zoomP} onClose={()=>setZoomP(null)} add={add} wa={wa}/>}
    {open&&<Cart cart={cart} setCart={setCart} products={products} close={()=>setOpen(false)} S={S} wa={wa}/>}
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
