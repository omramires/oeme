/* =====================  DEUDORES  ===================== */
const mesesDesde=f=>{const [y,m,d]=String(f).slice(0,10).split("-").map(Number);const n=new Date();let k=(n.getFullYear()-y)*12+(n.getMonth()+1-m);if(n.getDate()<d)k--;return Math.max(0,k)};
/* deuda manual: interés simple mensual sobre el monto original, por mes cumplido */
const deudaTotal=d=>r2(Number(d.monto_usdt)*(1+Number(d.interes_mensual||0)/100*mesesDesde(d.fecha)));
const deudaSaldo=d=>Math.max(0,r2(deudaTotal(d)-Number(d.pagado_usdt)));
const cliKey=(id,dni,nombre)=>id||(dni?"dni:"+dni:"n:"+String(nombre||"").trim().toLowerCase());
const fdt=s=>new Date(s).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});

/* Comprobante PDF con todo lo que debe un cliente */
function debtPdf(g,rate,tienda){
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J) throw new Error("no cargó el generador de PDF (revisá tu conexión)");
  const doc=new J({unit:"mm",format:"a4"}),M=15,PW=210;let y=20;
  const need=h=>{if(y+h>280){doc.addPage();y=20}};
  doc.setFont("helvetica","bold");doc.setFontSize(19);doc.setTextColor(20,20,20);doc.text("Resumen de deuda",M,y);
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(110,110,110);
  doc.text(`${tienda?tienda+"  ·  ":""}Emitido el ${new Date().toLocaleString("es-AR")}`,M,y+6);
  y+=18;doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(20,20,20);doc.text(g.nombre,M,y);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(90,90,90);doc.text(g.dni?`DNI ${g.dni}`:"Sin DNI",M,y+6);y+=14;
  const head=()=>{doc.setFillColor(192,0,0);doc.rect(M,y,PW-2*M,8,"F");doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(255,255,255);
    doc.text("Concepto",M+2,y+5.3);doc.text("Fecha",108,y+5.3);doc.text("Total",138,y+5.3,{align:"right"});doc.text("Pagado",163,y+5.3,{align:"right"});doc.text("Saldo",PW-M-2,y+5.3,{align:"right"});y+=8};
  head();
  g.debts.forEach(d=>{
    const lines=doc.splitTextToSize(d.concepto+(d.interesTxt?`  (${d.interesTxt})`:""),88);
    const pays=d.kind==="manual"?(d.raw.deuda_pagos||[]):[];
    need(7*lines.length+4+pays.length*5);
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(20,20,20);
    doc.text(lines,M+2,y+5);doc.text(dmy(d.fecha),108,y+5);doc.text(ud(d.total),138,y+5,{align:"right"});doc.text(ud(d.pagado),163,y+5,{align:"right"});
    doc.setFont("helvetica","bold");doc.text(ud(d.saldo),PW-M-2,y+5,{align:"right"});y+=6*lines.length+1;
    doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(110,110,110);
    pays.forEach(p=>{doc.text(`Pago ${fdt(p.fecha)}: ${ud(p.monto_usdt)}${p.nota?" · "+p.nota:""}`,M+6,y+3);y+=5});
    doc.setDrawColor(210,210,210);doc.line(M,y+1,PW-M,y+1);y+=3;
  });
  need(24);y+=4;doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(192,0,0);
  doc.text(`Total adeudado: ${ud(g.saldo)}`,PW-M,y,{align:"right"});
  if(rate){doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(90,90,90);doc.text(`≈ ${ars(g.saldo*rate)} ARS (dólar a ${ars(rate)})`,PW-M,y+6,{align:"right"})}
  doc.setFontSize(8);doc.setTextColor(130,130,130);doc.text("Documento informativo. Los importes en pesos se calculan con la cotización del día de emisión.",M,285);
  return doc;
}

    const cli=mode==="existente"?clients.find(c=>c.id===cliId):null;

    if(mode==="nuevo"&&!nuevo.nombre.trim()) return toast("Poné el nombre del cliente",1);

      await must(db.from("deudas").insert({cliente_id:cid,cliente_nombre:nom,cliente_dni:dni,monto_usdt:num(monto),interes_mensual:Math.max(0,num(interes)),concepto:concepto.trim()}));

    <div className="vseg" role="group" aria-label="Tipo de cliente">

      <div className="f"><label className="vl">Interés mensual %</label><input className="inp" style={{width:170}} inputMode="decimal" placeholder="Opcional · Ej: 10" value={interes} onChange={e=>setInteres(e.target.value)}/></div></div>
    <div className="f" style={{marginTop:6}}><label className="vl">Concepto / nota</label><input className="inp" placeholder={'Ej: "Préstamo por arreglo de módulo", "Saldo iPhone 12"…'} value={concepto} onChange={e=>setConcepto(e.target.value)}/></div>

function Deudores({ventas,deudas,clients,rate,reload,toast,toolsOk,tienda}){

  if(!toolsOk) return <NeedSql/>;
  const debts=[
    ...ventas.filter(v=>saldoOf(v)>0).map(v=>({kind:"venta",id:v.id,key:cliKey(v.cliente_id,v.cliente_dni,v.cliente_nombre),nombre:v.cliente_nombre||"Sin nombre",dni:v.cliente_dni,
      fecha:v.fecha,concepto:`Venta #${v.numero}${v.nota?` · ${v.nota}`:""}`,total:Number(v.total_usdt),pagado:Number(v.pagado_usdt),saldo:saldoOf(v),raw:v})),
    ...deudas.filter(d=>deudaSaldo(d)>0).map(d=>({kind:"manual",id:d.id,key:cliKey(d.cliente_id,d.cliente_dni,d.cliente_nombre),nombre:d.cliente_nombre,dni:d.cliente_dni,
      fecha:d.fecha,concepto:d.concepto||"Deuda manual",total:deudaTotal(d),pagado:Number(d.pagado_usdt),saldo:deudaSaldo(d),raw:d,
      interesTxt:Number(d.interes_mensual)>0?`${d.interes_mensual}% mensual × ${mesesDesde(d.fecha)} meses`:""}))];
  const map=new Map();
  debts.forEach(d=>{const g=map.get(d.key)||{key:d.key,nombre:d.nombre,dni:d.dni,debts:[],saldo:0};g.debts.push(d);g.saldo+=d.saldo;map.set(d.key,g)});

  const sV=debts.filter(d=>d.kind==="venta"),sM=debts.filter(d=>d.kind==="manual");

  const sum=a=>a.reduce((s,d)=>s+d.saldo,0);
  const pdf=g=>{try{debtPdf(g,rate,tienda).save(`deuda-${slugify(g.nombre)||"cliente"}-${ymd(new Date())}.pdf`);toast("Comprobante descargado")}catch(e){toast("No se pudo generar el PDF: "+e.message,1)}};

  return <>
    <div className="gh2"><div><h2>Deudores</h2><p>Todo lo que te deben: por ventas y deudas cargadas a mano (con interés si querés)</p></div>
      <button className="btn p big" onClick={()=>setForm(true)}><span className="plusb"><Ic n="plus"/></span>Nueva deuda</button></div>

/* =====================  PRÉSTAMOS (los que recibiste)  ===================== */
const pendiente=p=>Math.max(0,r2(Number(p.capital)-Number(p.capital_pagado)));
const fmtMon=(n,mon)=>mon==="USD"?ud(n):`${ars(n)} ARS`;

function PrestamoPayModal({p,onClose,onSaved,toast}){
  const pend=pendiente(p),mensual=r2(pend*Number(p.interes_mensual)/100);
  const [tipo,setTipo]=useState("interes"),[m,setM]=useState(""),[busy,setBusy]=useState(false);
  const save=async()=>{
    const a=num(m);if(!(a>0)) return toast("Poné el monto",1);
    if(tipo==="capital"&&a>pend+0.005) return toast("El monto supera el capital pendiente",1);
    setBusy(true);
    try{
      await must(db.from("prestamo_pagos").insert({prestamo_id:p.id,tipo,monto:a}));

/* La moneda del costo base (USD o pesos) define cómo se guarda y se muestra el producto en todo el panel y en la tienda. */
const priceUsd=(p,rate)=>p.moneda==="ARS"&&p.precio_ars!=null&&Number(rate)>0?Number(p.precio_ars)/Number(rate):Number(p.precio_usdt);
const priceArs=(p,rate)=>p.precio_ars!=null?Number(p.precio_ars):Math.round(Number(p.precio_usdt)*Number(rate||0));
const fmtNat=(n,mon)=>mon==="ARS"?`${ars(n)} ARS`:ud(n);
const IPHONES=["iPhone 11","iPhone 11 Pro","iPhone 11 Pro Max","iPhone 12 mini","iPhone 12","iPhone 12 Pro","iPhone 12 Pro Max","iPhone 13 mini","iPhone 13","iPhone 13 Pro","iPhone 13 Pro Max",
  "iPhone 14","iPhone 14 Plus","iPhone 14 Pro","iPhone 14 Pro Max","iPhone 15","iPhone 15 Plus","iPhone 15 Pro","iPhone 15 Pro Max","iPhone 16","iPhone 16 Plus","iPhone 16 Pro","iPhone 16 Pro Max",
  "iPhone 17","iPhone Air","iPhone 17 Pro","iPhone 17 Pro Max"];

/* variantes guardadas (color/talle/stock) <-> lo que edita el formulario:
   sin talle = lista simple (modelo, color o sabor) · con talle = tabla de moda (colores x talles) */
function splitVariants(vs){
  const all=vs||[],con=all.filter(v=>String(v.talle||"").trim()),sin=all.filter(v=>!String(v.talle||"").trim());
  return {tabla:tablaFrom(con),lista:sin.map(v=>({nombre:v.color||"",stock:v.stock==null?"":String(v.stock)}))};
}
function joinVariants(tabla,lista){
  const out=[];
  lista.forEach(r=>{if(r.nombre.trim()||String(r.stock).trim()!=="")out.push({color:r.nombre.trim(),talle:"",stock:Math.max(0,Math.round(num(r.stock)))})});
  if(tabla)tabla.colores.forEach((c,i)=>tabla.talles.forEach((t,j)=>{const v=String(tabla.stock[i][j]).trim();if(v===""||(!c.trim()&&!t.trim()))return;
    out.push({color:c.trim(),talle:t.trim(),stock:Math.max(0,Math.round(num(v)))})}));
  return out;
}

  const cost0=initial?(native==="ARS"?Number(initial.costo_ars||0):Number(initial.costo_usdt||0)):0;
  const price0=initial?(native==="ARS"?Number(initial.precio_ars||0):Number(initial.precio_usdt||0)):0;
  const sv=splitVariants(initial&&initial.variantes);
  const [f,setF]=useState({nombre:initial?initial.nombre:"",sku:initial?initial.sku||"":"",categoria:initial?initial.categoria:(cats[0]?cats[0].slug:""),
    moneda:native,costo:cost0>0?String(cost0):"",mkTipo:"pct",mk:initial?String(cost0>0&&price0>0?r2((price0/cost0-1)*100):0):"0",
    stock:initial&&initial.stock!=null?String(initial.stock):"",minimo:initial?String(initial.stock_minimo??3):"3",activo:initial?initial.activo:true});
  const [tabla,setTabla]=useState(sv.tabla),[lista,setLista]=useState(sv.lista);
  const [dirty,setDirty]=useState(!edit),[busy,setBusy]=useState(false),[extraC,setExtraC]=useState([]),[newCat,setNewCat]=useState(false);
  const set=(k,v)=>setF(s=>({...s,[k]:v}));

    if(m===f.moneda) return;

    const conv=v=>{const n=num(v);return n>0?(m==="ARS"?String(Math.round(n*rate)):String(r2(n/rate))):v};
    setF(s=>({...s,moneda:m,costo:conv(s.costo),mk:s.mkTipo==="abs"?conv(s.mk):s.mk}));setDirty(true);
  };
  const c=num(f.costo),mk=num(f.mk),price=f.mkTipo==="pct"?c*(1+mk/100):c+mk;
  const pUsd=f.moneda==="USD"?price:(rate?price/rate:0),pArs=f.moneda==="ARS"?price:price*(rate||0);
  const vars=joinVariants(tabla,lista),varStock=vars.reduce((s,v)=>s+v.stock,0);

  const catOpts=[...cats,...extraC.filter(e=>!cats.some(x=>x.slug===e.slug))].map(x=>({v:x.slug,l:x.nombre}));
  const addCat=async v=>{

    if(error&&error.code!=="23505") return toast("No se pudo crear la categoría: "+error.message,1);
    setExtraC(a=>[...a,{slug,nombre}]);set("categoria",slug);setNewCat(false);toast(`Categoría “${nombre}” creada`);onSaved(true);
  };

  const save=async()=>{
    if(!f.nombre.trim()) return toast("Poné el nombre del producto",1);

    if(!(c>0)) return toast("Poné el costo base",1);

    const row={nombre:f.nombre.trim(),sku:f.sku.trim(),categoria:f.categoria,stock,stock_minimo:Math.max(0,Math.round(num(f.minimo))||0),variantes:vars,activo:f.activo,

          <div className="sfx"><input className="inp" inputMode="decimal" value={f.mk} onChange={e=>setP("mk",e.target.value)} aria-label="Markup"/><span>{f.mkTipo==="pct"?"%":sym}</span></div></div>

          <label className="vl sm" style={{marginTop:10}}>Punto de re-compra</label>
          <input className="inp" inputMode="numeric" placeholder="3" value={f.minimo} onChange={e=>set("minimo",e.target.value.replace(/\D/g,""))}/></div>
      </div>
      <p className="help" style={{marginTop:10}}>Precio de venta = costo + markup: <b className="g">{fmtNat(price,f.moneda)}</b>{rate>0&&c>0&&<> · <span className="au">{f.moneda==="ARS"?ud(pUsd):`≈ ${ars(pArs)} ARS`}</span></>}.
        La moneda que elegís acá se usa en todo el inventario y en la tienda para este producto{f.moneda==="ARS"?" (el precio en pesos queda fijo y el valor en dólares se calcula con la cotización del día)":" (el precio en pesos se calcula con la cotización del día)"}.</p>
    </div>

    <VariantsEditor tabla={tabla} setTabla={setTabla} lista={lista} setLista={setLista}/>
    <label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}>
      <button type="button" role="switch" aria-checked={f.activo} className={"sw"+(f.activo?" on":"")} onClick={()=>set("activo",!f.activo)}/> Visible en la tienda</label>
    {newCat&&<PromptModal title="Nueva categoría" label="Nombre de la categoría" hint="Se crea como una sección nueva en el menú y en la tienda." initial="" onSave={addCat} onClose={()=>setNewCat(false)}/>}
  </Modal>;
}

/* Ajustar stock: ingreso / egreso / establecer (o editar cada variante) */
function StockModal({p,onClose,onSaved,toast}){
  const hasVar=(p.variantes||[]).length>0;
  const [mode,setMode]=useState("ingreso"),[q,setQ]=useState(""),[vs,setVs]=useState((p.variantes||[]).map(v=>({...v,stock:String(v.stock??0)}))),[busy,setBusy]=useState(false);
  const cur=Number(p.stock||0),n=Math.round(num(q));
  const next=mode==="ingreso"?cur+n:mode==="egreso"?Math.max(0,cur-n):n;
  const save=async()=>{
    let patch;
    if(hasVar){const variantes=vs.map(v=>({...v,stock:Math.max(0,Math.round(num(v.stock)))}));patch={variantes,stock:variantes.reduce((s,v)=>s+v.stock,0)}}
    else{if(q==="") return toast("Poné la cantidad",1);patch={stock:next}}
    setBusy(true);const {error}=await db.from("productos").update(patch).eq("id",p.id);setBusy(false);
    if(error) return toast("No se pudo actualizar el stock: "+error.message,1);
    toast("Stock actualizado");onSaved();onClose();
  };
  return <Modal title={`Stock · ${p.nombre}`} onClose={onClose} foot={<><button className="btn" onClick={onClose}>Cancelar</button><button className="btn p" onClick={save} disabled={busy}>Guardar stock</button></>}>
    {hasVar?<><p className="help" style={{marginTop:-4}}>Este producto tiene variantes: cargá el stock de cada una.</p>
      {vs.map((v,i)=><div className="vrow" key={i} style={{gridTemplateColumns:"1fr 120px"}}><div className="inp" style={{display:"flex",alignItems:"center"}}>{v.color}{v.talle?` / ${v.talle}`:""}</div>
        <input className="inp" inputMode="numeric" value={v.stock} onChange={e=>setVs(vs.map((x,j)=>j===i?{...x,stock:e.target.value.replace(/\D/g,"")}:x))} aria-label={`Stock de ${v.color} ${v.talle||""}`}/></div>)}</>
    :<><div className="g3"><div><div className="lbl">Stock actual</div><b style={{fontSize:22}} className="g">{p.stock==null?"—":cur}</b></div>
        <div><div className="lbl">Punto de re-compra</div><b style={{fontSize:22}}>{p.stock_minimo}</b></div><div><div className="lbl">Quedará en</div><b style={{fontSize:22}}>{q===""?"—":next}</b></div></div>
      <div className="vseg" role="group" aria-label="Movimiento">{[["ingreso","Ingreso"],["egreso","Egreso"],["ajuste","Establecer"]].map(([k,l])=><button key={k} type="button" className={mode===k?"on":""} onClick={()=>setMode(k)}>{l}</button>)}</div>
      <div className="f"><label>{mode==="ajuste"?"Nuevo stock":"Cantidad de unidades"}</label>
        <input className="inp" autoFocus inputMode="numeric" value={q} onChange={e=>setQ(e.target.value.replace(/\D/g,""))} onKeyDown={e=>e.key==="Enter"&&save()}/></div></>}
  </Modal>;
}

/* Difusión por WhatsApp: arma el mensaje con tus productos y precios */

    const base=`• ${p.nombre} — ${usd(priceUsd(p,rate))}${rate?` (${ars(p.moneda==="ARS"?priceArs(p,rate):priceUsd(p,rate)*rate)})`:""}`;

    <div className="g2"><div className="f"><label>Título</label><input className="inp" value={head} onChange={e=>setHead(e.target.value)}/></div><div className="f"><label>Cierre</label><input className="inp" value={foot} onChange={e=>setFoot(e.target.value)}/></div></div>
    <div className="f"><label>Mensaje ({sel.length} productos)</label><textarea className="inp" rows="7" readOnly value={text}/>
      {text.length>1800&&<p className="help" style={{color:"var(--gold)"}}>El mensaje es largo: para enviarlo a un contacto usá “Copiar” y pegalo en WhatsApp.</p>}</div>
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}><button className="btn p" onClick={copy}>Copiar mensaje</button>
      <a className="btn gr" target="_blank" rel="noreferrer" href={`https://wa.me/?text=${encodeURIComponent(text)}`}>Abrir WhatsApp (elegir contacto)</a></div>
    <div className="f"><label>Enviar a tus clientes con teléfono ({list.length})</label>
      <div className="seg" style={{marginBottom:8}}>{["todos","mayorista","minorista"].map(t=><button key={t} className={tipo===t?"on":""} onClick={()=>setTipo(t)}>{t[0].toUpperCase()+t.slice(1)}</button>)}</div>
      {list.length===0?<p className="emp" style={{padding:"12px 0"}}>No hay clientes con teléfono cargado.</p>
      :<div className="tw" style={{maxHeight:220,overflow:"auto"}}><table><tbody>{list.map(c=><tr key={c.id}><td><b>{c.nombre}</b><div className="mut" style={{fontSize:11}}>{c.telefono} · {c.tipo}</div></td>

function Inventario({products,cats,ventas,clients,rate,reload,toast,go}){
  const [q,setQ]=useState(""),[cat,setCat]=useState(""),[modal,setModal]=useState(null),[stockP,setStockP]=useState(null),[wa,setWa]=useState(false);
  const [hide,setHide]=useState(()=>{try{return localStorage.getItem("hideMoney")==="1"}catch{return false}});
  const fileRef=useRef();
  const toggleHide=()=>setHide(h=>{const n=!h;try{localStorage.setItem("hideMoney",n?"1":"0")}catch{}return n});
  const nat=p=>p.moneda==="ARS"?Number(p.costo_ars||0):Number(p.costo_usdt||0);
  const units=p=>p.stock==null?0:Number(p.stock);
  const sub=p=>nat(p)*units(p),subArs=p=>p.moneda==="ARS"?sub(p):sub(p)*(rate||0);
  const catName=s=>(cats.find(c=>c.slug===s)||{}).nombre||s;
  const lowOf=p=>p.stock!=null&&Number(p.stock)<=Number(p.stock_minimo);
  const margins=useMemo(()=>{const m=new Map();
    ventas.forEach(v=>(v.venta_items||[]).forEach(i=>{if(!i.producto_id)return;const x=m.get(i.producto_id)||{rev:0,cost:0};x.rev+=i.cantidad*Number(i.precio_usdt);x.cost+=i.cantidad*Number(i.costo_usdt);m.set(i.producto_id,x)}));return m},[ventas]);
  const list=products.filter(p=>(!cat||p.categoria===cat)&&(!q||`${p.nombre} ${p.sku||""} ${p.marca||""}`.toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  const capital=products.reduce((s,p)=>s+subArs(p),0),totUnits=products.reduce((s,p)=>s+units(p),0),low=products.filter(lowOf).length;
  const th=(()=>{const c={};products.forEach(p=>{c[p.stock_minimo]=(c[p.stock_minimo]||0)+1});const e=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:"3"})();
  const listTotal=list.reduce((s,p)=>s+subArs(p),0);
  const M=({children})=><span className="money">{children}</span>;

  const del=async p=>{if(!confirm(`¿Eliminar “${p.nombre}” del inventario y de la tienda? Las ventas anteriores conservan su nombre.`))return;
    const {error}=await db.from("productos").delete().eq("id",p.id);error?toast("No se pudo eliminar: "+error.message,1):(toast("Producto eliminado"),reload())};

  const exportXlsx=()=>{
    if(!window.XLSX) return toast("No cargó el generador de Excel (revisá tu conexión)",1);
    if(!list.length) return toast("No hay productos para descargar",1);
    const rows=list.map(p=>({"Producto":p.nombre,"SKU":p.sku||"","Categoría":catName(p.categoria),"Moneda":p.moneda==="ARS"?"ARS":"USD","Costo unit.":nat(p),"Stock":p.stock==null?"":p.stock,
      "Subtotal":sub(p),"Subtotal ARS":Math.round(subArs(p)),"Precio de venta USDT":r2(priceUsd(p,rate)),"Precio de venta ARS":Math.round(priceArs(p,rate)),"Punto de re-compra":p.stock_minimo}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Inventario");XLSX.writeFile(wb,`inventario-${ymd(new Date())}.xlsx`);toast("Excel descargado");
  };
  const importFile=async e=>{
    const file=e.target.files[0];e.target.value="";if(!file)return;
    try{
      if(!window.XLSX) throw new Error("No cargó el lector de Excel");
      const wb=XLSX.read(await file.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const nk=k=>String(k).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
      const get=(r,keys)=>{for(const k of Object.keys(r)){const n=nk(k);if(keys.some(x=>n.includes(x)))return r[k]}return ""};
      const skus=new Set(products.map(p=>p.sku).filter(Boolean)),catBy=new Map(cats.map(c=>[nk(c.nombre),c.slug]));
      const out=[],newCats=new Map();let skipped=0;
      rows.forEach(r=>{
        const nombre=String(get(r,["producto","nombre","articulo"])).trim(),sku=String(get(r,["sku","codigo"])).trim();
        if(!nombre||(sku&&skus.has(sku))){skipped++;return}if(sku)skus.add(sku);
        const cn=String(get(r,["categoria","rubro"])).trim();let slug=catBy.get(nk(cn));
        if(!slug){const base=cn||"General";slug=slugify(base)||"general";catBy.set(nk(base),slug);if(!cats.some(c=>c.slug===slug))newCats.set(slug,base)}
        const enPesos=/peso|ars|\$/i.test(String(get(r,["moneda"]))),costo=num(get(r,["costo"])),precio=num(get(r,["precio","venta"]))||costo;
        if(enPesos&&!rate) throw new Error("Esperando la cotización del dólar para convertir los productos en pesos");
        out.push({nombre,sku,categoria:slug,moneda:enPesos?"ARS":"USD",costo_usdt:enPesos?r2(costo/rate):r2(costo),costo_ars:enPesos?r2(costo):null,
          precio_usdt:enPesos?r2(precio/rate):r2(precio),precio_ars:enPesos?Math.round(precio):null,stock:Math.max(0,Math.round(num(get(r,["stock","cantidad"])))),
          stock_minimo:Math.round(num(get(r,["recompra","minimo"])))||3})});
      if(!out.length) return toast("No encontré productos nuevos (necesita una columna “Producto” o “Nombre”)",1);
      if(newCats.size) await must(db.from("categorias").insert([...newCats].map(([slug,nombre],i)=>({slug,nombre,titulo_home:nombre,orden:cats.length+i+1}))));

    }catch(err){toast("No se pudo importar: "+(err.message||err),1)}

    <div className="gks">

      <div className="gk" style={{minHeight:0}}><h4>Stock bajo (≤{th})</h4><div className="v" style={{marginBottom:0,color:low?"var(--gold)":undefined}}>{low}</div></div></div>

    <div className="vtool">
      <input className="inp vsearch" style={{flex:1,width:"auto",borderRadius:10}} placeholder="Buscar producto o SKU…" value={q} onChange={e=>setQ(e.target.value)} aria-label="Buscar producto o SKU"/>
      <select className="sel" style={{padding:"11px 14px"}} value={cat} onChange={e=>setCat(e.target.value)} aria-label="Categoría"><option value="">Todas las categorías</option>{cats.map(c=><option key={c.slug} value={c.slug}>{c.nombre}</option>)}</select></div>

    {products.length===0?<div className="empty-c" style={{padding:"70px 0"}}><div className="dollar" style={{fontSize:40}}>📦</div><b>Tu inventario está vacío</b>Agregá tu primer producto o importá un Excel
      <div style={{marginTop:16}}><button className="btn p" onClick={()=>setModal({})}><Ic n="plus"/>Producto</button></div></div>
    :<div className="tw"><table>
      <thead><tr><th>Producto</th><th>Categoría</th><th>Costo unit.</th><th>Stock</th><th>Subtotal</th><th>% Ganancia</th><th></th></tr></thead>
      <tbody>{list.length===0&&<tr><td colSpan="7" className="emp">Ningún producto coincide con la búsqueda</td></tr>}

            {(p.variantes||[]).length>0&&<div className="mut" style={{fontSize:11}}>{p.variantes.length} variantes</div>}</td>
          <td><M>{fmtNat(sub(p),p.moneda)}</M></td>
          <td>{m?(pct===null?<span className="mut">—</span>:<b className={pct>=0?"g":""} style={pct<0?{color:"var(--red)"}:null}>{pct>=0?"+":""}{pct.toLocaleString("es-AR",{maximumFractionDigits:1})}%</b>):<span className="mut" style={{fontSize:12}}>Sin ventas</span>}</td>
          <td><div className="acts"><button className="btn gr" style={{padding:"6px 14px"}} onClick={()=>setStockP(p)}>Stock</button>

function Dd({value,options,onChange,label}){
  const [open,setOpen]=useState(false);const ref=useRef();
  useEffect(()=>{if(!open)return;const f=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener("mousedown",f);return()=>document.removeEventListener("mousedown",f)},[open]);
  const cur=options.find(o=>o[0]===value);
  return <div className="combo" ref={ref}>
    <button type="button" className="inp cbtn" aria-haspopup="listbox" aria-expanded={open} aria-label={label} onClick={()=>setOpen(!open)}>
      <span>{cur?cur[1]:""}</span><svg className="i" viewBox="0 0 24 24" style={open?{transform:"rotate(180deg)"}:null}><path d="m6 9 6 6 6-6"/></svg></button>
    {open&&<div className="cpanel" role="listbox" aria-label={label}>{options.map(([k,l])=>

  </div>;
}

    toast(tipo==="pago"?"Pago registrado":tipo==="extra"?"Extra agregado":"Comisión restada");onSaved();onClose();
  };
  return <Modal title={T} onClose={onClose} w={460} mt="10vh" clean>
    <p className="help" style={{marginTop:-4}}>{H}</p>
    <div><label className="ulab">Vendedor</label><Dd label="Vendedor" value={vid} options={vendedores.map(v=>[v.id,v.nombre])} onChange={setVid}/></div>
    {tipo==="pago"&&vid&&<div className="uinfo">Deuda actual de comisiones: <b style={{color:"var(--gold)"}}>{ars(d)} ARS</b></div>}
    <div className="g2"><div><label className="ulab">Monto</label><input className="inp" autoFocus inputMode="decimal" value={m} onChange={e=>setM(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()}/></div>
      <div><label className="ulab">Moneda</label><div className="mseg"><button type="button" className={mon==="ARS"?"on":""} onClick={()=>setMon("ARS")}>$ Pesos</button><button type="button" className={mon==="USD"?"on":""} onClick={()=>setMon("USD")}>USD</button></div></div></div>
    {tipo==="pago"&&d>0&&<button type="button" className="btn gr sm" style={{justifySelf:"start"}} onClick={()=>setM(String(mon==="USD"?(rate?r2(d/rate):""):Math.round(d)))}>Pagar toda la deuda</button>}
    <div className="g2"><div><label className="ulab">Fecha</label><input className="inp" type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/></div>
      <div><label className="ulab">Nota (opcional)</label><input className="inp" value={nota} onChange={e=>setNota(e.target.value)}/></div></div>
    <div className="uft"><button className="btn" onClick={onClose}>Cancelar</button><button className="btn p" onClick={save} disabled={busy}>{T}</button></div>
  </Modal>;
}

function PerfilModal({v,onClose,onSaved,toast}){
  const [p,setP]=useState(String(v.comision_pct??0)),[c,setC]=useState(v.cargo||"Vendedor Premium"),[busy,setBusy]=useState(false);
  const save=async()=>{
    const x=num(p);if(x<0||x>100) return toast("La comisión va de 0 a 100%",1);
    setBusy(true);const {error}=await db.from("vendedores").update({comision_pct:x,cargo:c.trim()||"Vendedor Premium"}).eq("id",v.id);setBusy(false);
    if(error) return toast("No se pudo guardar: "+error.message,1);
    toast("Perfil actualizado");onSaved();onClose();
  };
  return <Modal title={`Editar perfil · ${v.nombre}`} onClose={onClose} w={432} mt="12vh" clean>
    <div><label className="ulab">% de comisión sobre la ganancia</label><div className="sfx"><input className="inp" autoFocus inputMode="decimal" value={p} onChange={e=>setP(e.target.value)}/><span>%</span></div></div>
    <div><label className="ulab">Nivel / cargo</label><input className="inp" value={c} onChange={e=>setC(e.target.value)} placeholder="Vendedor Premium"/></div>
    <p className="help">Los cambios aplican a las ventas nuevas.</p>
    <div className="uft"><button className="btn" onClick={onClose}>Cancelar</button><button className="btn p" onClick={save} disabled={busy}>Guardar</button></div>
  </Modal>;
}

function Comisiones({ventas,vendedores,usuarios,movs,rate,reload,toast,toolsOk}){
  const [ym,setYm]=useState(ymNow()),[vf,setVf]=useState(""),[modal,setModal]=useState(null),[perfil,setPerfil]=useState(null);
  if(!toolsOk) return <NeedSql/>;
  const cotV=v=>Number(v.cotizacion)||Number(rate)||0;
  const inM=d=>String(d).slice(0,7)===ym;
  const perfiles=vendedores.filter(v=>v.activo!==false);
  const vname=id=>(vendedores.find(x=>x.id===id)||{}).nombre||"—";
  const tot=(fn,onlyP)=>{
    const vs=ventas.filter(v=>v.vendedor_id&&fn(v.vendedor_id)&&(!onlyP||inM(v.fecha)));
    const ms=movs.filter(m=>fn(m.vendedor_id)&&(!onlyP||inM(m.fecha)));
    const k=t=>ms.filter(m=>m.tipo===t).reduce((s,m)=>s+Number(m.monto_usdt)*(rate||0),0);
    return {n:vs.length,com:vs.reduce((s,v)=>s+Number(v.comision_usdt)*cotV(v),0),ext:k("extra"),res:k("resta"),pag:k("pago")};
  };
  const sel=id=>!vf||id===vf;
  const all=tot(sel,false),per=tot(sel,true);
  const deuda=all.com+all.ext-all.res-all.pag,comP=per.com+per.ext-per.res;
  const deudaArs=id=>{const t=tot(x=>x===id,false);return Math.max(0,t.com+t.ext-t.res-t.pag)};
  const rows=[
    ...ventas.filter(v=>v.vendedor_id&&sel(v.vendedor_id)&&inM(v.fecha)).map(v=>({k:"v"+v.id,fecha:v.fecha,tipo:"venta",vend:v.vendedor_id,
      det:`Venta #${v.numero} · ${v.cliente_nombre||"—"}`,sub:`Ganancia bruta ${usd(Number(v.total_usdt)-Number(v.costo_usdt))}`,usd:Number(v.comision_usdt),ars:Number(v.comision_usdt)*cotV(v)})),
    ...movs.filter(m=>sel(m.vendedor_id)&&inM(m.fecha)).map(m=>({k:"m"+m.id,id:m.id,fecha:m.fecha,tipo:m.tipo,vend:m.vendedor_id,det:m.nota||({extra:"Extra",resta:"Resta",pago:"Pago"}[m.tipo]),sub:"",usd:Number(m.monto_usdt),ars:Number(m.monto_usdt)*(rate||0)}))
  ].sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0);
  const TIPO={venta:["st-entregado","Comisión"],extra:["st-confirmado","Extra"],resta:["st-cancelado","Resta"],pago:["st-enviado","Pago"]};
  const neg=t=>t==="resta"||t==="pago";
  const months=Array.from({length:24},(_,i)=>ymAdd(ymNow(),-i));
  const delM=async id=>{if(!confirm("¿Eliminar este movimiento?"))return;const {error}=await db.from("comision_movimientos").delete().eq("id",id);error?toast("No se pudo eliminar",1):(toast("Movimiento eliminado"),reload())};
  const exportar=()=>{
    if(!window.XLSX) return toast("No cargó el generador de Excel (revisá tu conexión)",1);
    if(!rows.length&&!perfiles.length) return toast("No hay datos para exportar",1);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.map(r=>({"Fecha":dmy(r.fecha),"Vendedor":vname(r.vend),"Tipo":TIPO[r.tipo][1],"Concepto":r.det,"Monto ARS":Math.round(neg(r.tipo)?-r.ars:r.ars),"Monto USDT":r2(neg(r.tipo)?-r.usd:r.usd)}))),"Movimientos");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(perfiles.filter(v=>sel(v.id)).map(v=>{const p=tot(x=>x===v.id,true),a=tot(x=>x===v.id,false);
      return {"Vendedor":v.nombre,"% comisión":Number(v.comision_pct),"Ventas del período":p.n,"Comisiones ARS":Math.round(p.com),"Extras ARS":Math.round(p.ext),"Restas ARS":Math.round(p.res),"Pagos ARS":Math.round(p.pag),"Deuda total ARS":Math.round(a.com+a.ext-a.res-a.pag)}})),"Resumen");
    XLSX.writeFile(wb,`comisiones-${ym}.xlsx`);toast("Resumen descargado");
  };
  const uname=v=>{const u=usuarios.find(x=>x.vendedor_id===v.id);return u?` · @${u.usuario}`:""};
  const vOpts=perfiles;
  return <>
    <div className="cbar">
      <button className={"btn rnd"+(ym===ymNow()?" on":"")} onClick={()=>setYm(ymNow())}>Este mes</button>
      <button className={"btn rnd"+(ym===ymAdd(ymNow(),-1)?" on":"")} onClick={()=>setYm(ymAdd(ymNow(),-1))}>Mes pasado</button>
      <label className="cpick"><Ic n="cal"/><select className="sel" value={ym} onChange={e=>setYm(e.target.value)} aria-label="Mes">{months.map((m,i)=><option key={m} value={m}>{i===0?"Este mes":ymLabel(m)}</option>)}</select></label>
      <label className="cpick"><select className="sel" value={vf} onChange={e=>setVf(e.target.value)} aria-label="Vendedor"><option value="">Todos los vendedores</option>{vOpts.map(v=><option key={v.id} value={v.id}>{v.nombre}</option>)}</select></label>
      <button className="btn gr sm" onClick={exportar}><Ic n="dl"/>Exportar resumen</button>
      <span className="sp"/>
      <button className="btn p big" onClick={()=>setModal({tipo:"pago"})}><Ic n="cash"/>Registrar pago</button></div>

    <div className="cstrip"><span>Deuda total (histórico): <b style={{color:"var(--gold)"}}>{ars(deuda)} ARS</b></span>
      <span>Comisiones del periodo: <b>{ars(comP)} ARS</b></span><span>Pagos del periodo: <b style={{color:"var(--green)"}}>{ars(per.pag)} ARS</b></span><span className="sp"/><span>Ventas premium: <b>{per.n}</b></span></div>

    <div className="pbox"><h3><Ic n="gear"/>Perfiles de vendedores</h3><p className="s">Definí el % de comisión y el nivel/cargo de cada vendedor. Los cambios aplican a las ventas nuevas.</p>
      {perfiles.length===0&&<p className="mut" style={{fontSize:12.5}}>Todavía no hay vendedores. Creá un usuario con rol “Vendedor con comisión” en Usuarios.</p>}
      {perfiles.map(v=><div className="prow" key={v.id}><span className="av au">{(v.nombre||"?").trim()[0].toUpperCase()}</span>
        <div className="nm"><b>{v.nombre}</b><small>{v.cargo||"Vendedor Premium"}<span style={{opacity:.7}}>{uname(v)}</span></small></div>
        <span className="pct"><b>{Number(v.comision_pct)}%</b>comisión</span>
        <button className="btn sm" onClick={()=>setPerfil(v)}>Editar perfil</button></div>)}</div>

    <div className="cbar" style={{marginTop:2}}>
      <button className="btn xg sm" onClick={()=>setModal({tipo:"extra"})}><Ic n="plus"/>Agregar Extra</button>
      <button className="btn xr sm" onClick={()=>setModal({tipo:"resta"})}><Ic n="minus"/>Restar comisión</button></div>

    {rows.length===0?<div className="cempty"><Ic n="star"/><b>No hay comisiones registradas</b>Las comisiones se generan automáticamente cuando un Vendedor Premium registra una venta, o podés agregar extras manualmente.</div>
    :<div className="tw"><table><thead><tr><th>Fecha</th><th>Vendedor</th><th>Concepto</th><th>Tipo</th><th>Monto</th><th></th></tr></thead><tbody>
      {rows.map(r=><tr key={r.k}><td className="mut" style={{whiteSpace:"nowrap"}}>{dmy(r.fecha)}</td><td><b>{vname(r.vend)}</b></td>
        <td>{r.det}{r.sub&&<div className="mut" style={{fontSize:11}}>{r.sub}</div>}</td>
        <td><span className={"pill "+TIPO[r.tipo][0]}>{TIPO[r.tipo][1]}</span></td>
        <td><b style={{color:neg(r.tipo)?"var(--red)":"var(--green)"}}>{neg(r.tipo)?"−":""}{ars(r.ars)} ARS</b><div className="mut" style={{fontSize:11}}>{usd(r.usd)}</div></td>
        <td><div className="acts">{r.id&&<button className="ib d" onClick={()=>delM(r.id)} aria-label="Eliminar movimiento"><Ic n="del"/></button>}</div></td></tr>)}</tbody></table></div>}

    {modal&&<MovModal tipo={modal.tipo} vendedores={perfiles} vend0={vf} rate={rate} deudaArs={deudaArs} onClose={()=>setModal(null)} onSaved={reload} toast={toast}/>}
    {perfil&&<PerfilModal v={perfil} onClose={()=>setPerfil(null)} onSaved={reload} toast={toast}/>}
  </>;
}

/* =====================  PANEL  ===================== */
const ROL_TXT={admin:"Administrador",vendedor:"Vendedor",vendedor_comision:"Vendedor premium"};
function Panel({user,perfil}){
  const isAdmin=perfil.rol==="admin";
  const [page,setPage]=useState(isAdmin?"dash":"ventas"),[nav,setNav]=useState(false),[grp,setGrp]=useState({tools:true,cat:true,cfg:true});
  const [cats,setCats]=useState([]),[opciones,setOpciones]=useState([]),[gastos,setGastos]=useState([]),[fijos,setFijos]=useState([]),[fijosPagos,setFijosPagos]=useState([]),[deudas,setDeudas]=useState([]),[prestamos,setPrestamos]=useState([]),[toolsOk,setToolsOk]=useState(true),[tienda,setTienda]=useState(""),[ventas,setVentas]=useState([]),[vendedores,setVendedores]=useState([]),[ventasOk,setVentasOk]=useState(true),[products,setProducts]=useState([]),[orders,setOrders]=useState([]),[clients,setClients]=useState([]),[usuarios,setUsuarios]=useState([]),[usersOk,setUsersOk]=useState(true),[movs,setMovs]=useState([]),[movsOk,setMovsOk]=useState(true),[loading,setLoading]=useState(true);
  const [toastEl,toast]=useToast();
  const cot=useCotizacion(toast,isAdmin);
  const rate=cot.cfg.valor;
  const reload=useCallback(async()=>{
    const none=Promise.resolve({data:[],error:null});
    const [c,p,o,cl,op,vt,vd,gs,gf,gp,dd,pr,aj,cm,us]=await Promise.all([
      db.from("categorias").select("*").order("orden"),
      db.from("productos").select("*").order("orden").order("created_at",{ascending:false}),
      db.from("pedidos").select("*, pedido_items(*), clientes(telefono)").order("created_at",{ascending:false}).limit(2000),
      db.from("clientes").select("*").order("created_at",{ascending:false}).limit(5000),
      db.from("catalogo_opciones").select("*"),
      db.from("ventas").select("*, venta_items(*)").order("fecha",{ascending:false}).order("created_at",{ascending:false}).limit(5000),
      db.from("vendedores").select("*").order("nombre"),
      db.from("gastos").select("*").order("fecha",{ascending:false}).limit(5000),
      db.from("gastos_fijos").select("*").order("created_at"),
      db.from("gastos_fijos_pagos").select("*"),
      db.from("deudas").select("*, deuda_pagos(*)").order("created_at",{ascending:false}),
      db.from("prestamos").select("*, prestamo_pagos(*)").order("created_at",{ascending:false}),
      db.from("ajustes").select("valor").eq("clave","tienda").maybeSingle(),
      isAdmin?db.from("comision_movimientos").select("*").order("fecha",{ascending:false}).limit(5000):none,
      isAdmin?db.rpc("panel_listar_usuarios"):none]);
    const e=c.error||p.error||o.error||cl.error;
    if(e) toast("Error al cargar datos (¿ejecutaste el supabase.sql actualizado?): "+e.message,1);
    setCats(c.data||[]);setProducts(p.data||[]);setOrders(o.data||[]);setClients(cl.data||[]);setOpciones(op.data||[]);setVentas(vt.data||[]);setVentasOk(!vt.error&&!vd.error);setVendedores(vd.data||[]);setGastos(gs.data||[]);setFijos(gf.data||[]);setFijosPagos(gp.data||[]);setDeudas(dd.data||[]);setPrestamos(pr.data||[]);
    setMovs(cm.data||[]);setMovsOk(!cm.error);setUsuarios(Array.isArray(us.data)?us.data:[]);setUsersOk(!us.error);
    setToolsOk(!gs.error&&!gf.error&&!gp.error&&!dd.error&&!pr.error);setTienda((aj.data&&aj.data.valor&&aj.data.valor.tienda)||"");setLoading(false);
  },[]);
  useEffect(()=>{reload()},[]);
  const inv=useMemo(()=>products.filter(p=>!p.inventario_id),[products]);
  const go=p=>{setPage(p);setNav(false);window.scrollTo(0,0)};
  const Nv=({id,ic,label,sub})=><button className={"nv"+(sub?" sub":"")+(page===id?" on":"")} onClick={()=>go(id)} aria-current={page===id?"page":undefined}>{ic&&<Ic n={ic}/>}{label}</button>;
  const pending=orders.filter(o=>o.estado==="pendiente").length;
  const inTools=["gastos","deudores","prestamos"].includes(page),inCat=page.startsWith("prod:"),inCfg=["cotizacion","comisiones","usuarios"].includes(page);
  const clickTools=()=>setGrp(g=>({...g,tools:!g.tools}));
  const clickCfg=()=>setGrp(g=>({...g,cfg:!g.cfg}));
  const clickCat=()=>{if(!inCat){go("prod:");setGrp(g=>({...g,cat:true}))}else setGrp(g=>({...g,cat:!g.cat}))};
  const Chev=({open})=><svg className={"i chev"+(open?" open":"")} viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>;
  const pg=isAdmin||["ventas","clientes"].includes(page)?page:"ventas";
  const TITLES={dash:"Dashboard",pedidos:"Pedidos",clientes:"Clientes",inventario:"Inventario",ventas:"Ventas",deudores:"Deudores",gastos:"Gastos",prestamos:"Préstamos",categorias:"Categorías",ajustes:"Ajustes",cotizacion:"Cotización Dólar",comisiones:"Comisiones",usuarios:"Usuarios"};
  const title=TITLES[pg]||"Catálogo";
  return <div className="app">
    <aside className={"side"+(nav?" open":"")}>
      <div className="logo"><span><Ic n="chart"/></span>Panel</div>
      <div className="grp">Reportes</div>
      {isAdmin&&<>
        <Nv id="dash" ic="dash" label="Dashboard"/>
        <Nv id="inventario" ic="pkg" label="Inventario"/>
        <button className={"nv"+(page==="pedidos"?" on":"")} onClick={()=>go("pedidos")}><Ic n="list"/>Pedidos{pending>0&&<span className="pill st-pendiente" style={{marginLeft:"auto"}}>{pending}</span>}</button></>}
      <Nv id="ventas" ic="cash" label="Ventas"/>
      <Nv id="clientes" ic="user" label="Clientes"/>
      {isAdmin&&<>
        <div className="grp">Herramientas</div>
        <button className={"nv"+(inTools?" grp-on":"")} aria-expanded={grp.tools} onClick={clickTools}><Ic n="wrench"/>Herramientas<Chev open={grp.tools}/></button>
        {grp.tools&&<><Nv id="gastos" ic="receipt" label="Gastos" sub/><Nv id="deudores" ic="tag" label="Deudores" sub/><Nv id="prestamos" ic="bank" label="Préstamos" sub/></>}
        <div className="grp">Catálogo</div>
        <button className={"nv"+(inCat?" grp-on":"")} aria-expanded={grp.cat} onClick={clickCat}><Ic n="pkg"/>Catálogo<Chev open={grp.cat}/></button>
        {grp.cat&&cats.map(c=><Nv key={c.slug} id={"prod:"+c.slug} label={c.nombre} sub/>)}
        <div className="grp">Ajustes</div>
        <button className={"nv"+(inCfg?" grp-on":"")} aria-expanded={grp.cfg} onClick={clickCfg}><Ic n="gear"/>Configuración<Chev open={grp.cfg}/></button>
        {grp.cfg&&<><Nv id="cotizacion" ic="dollarc" label="Cotización Dólar" sub/><Nv id="comisiones" ic="pct" label="Comisiones" sub/><Nv id="usuarios" ic="users" label="Usuarios" sub/></>}
        <Nv id="categorias" ic="tag" label="Categorías"/>
        <Nv id="ajustes" ic="set" label="Ajustes de la tienda"/></>}
      <div className="me"><b>{perfil.nombre||user.email}</b><small>{ROL_TXT[perfil.rol]||"Usuario"}</small>
        <div className="r">{isAdmin&&<a href="index.html" target="_blank" rel="noreferrer"><Ic n="ext"/>Ver tienda</a>}
          <button onClick={()=>db.auth.signOut()}><Ic n="out"/>Salir</button></div></div>
    </aside>
    <div className="main">
      <div className="top"><button className="menu" onClick={()=>setNav(!nav)} aria-label="Menú"><Ic n="menu"/></button><h1>{title}</h1>
        {isAdmin?<RatesBar toast={toast} cot={cot}/>:<span className="sp" style={{flex:1}}/>}</div>
      <div className="content">
        {loading?<p className="emp">Cargando datos…</p>:
         pg==="dash"?<Dashboard orders={orders} products={inv} clients={clients} ventas={ventas} gctx={{fijos,pagos:fijosPagos,gastos,rate}} go={go}/>:
         pg==="pedidos"?<Pedidos orders={orders} reload={reload} toast={toast}/>:
         pg==="inventario"?<Inventario products={inv} cats={cats} ventas={ventas} clients={clients} rate={rate} reload={reload} toast={toast} go={go}/>:
         pg==="ventas"?<Ventas ventas={ventas} ventasOk={ventasOk} clients={clients} products={inv} cats={cats} vendedores={vendedores} rate={rate} perfil={perfil} reload={reload} toast={toast}/>:
         pg==="gastos"?<Gastos gastos={gastos} fijos={fijos} pagos={fijosPagos} rate={rate} reload={reload} toast={toast} toolsOk={toolsOk}/>:
         pg==="deudores"?<Deudores ventas={ventas} deudas={deudas} clients={clients} rate={rate} reload={reload} toast={toast} toolsOk={toolsOk} tienda={tienda}/>:
         pg==="prestamos"?<Prestamos prestamos={prestamos} rate={rate} reload={reload} toast={toast} toolsOk={toolsOk}/>:
         pg==="cotizacion"?<Cotizacion cot={cot}/>:
         pg==="comisiones"?<Comisiones ventas={ventas} vendedores={vendedores} usuarios={usuarios} movs={movs} rate={rate} reload={reload} toast={toast} toolsOk={movsOk}/>:
         pg==="usuarios"?<Usuarios usuarios={usuarios} usersOk={usersOk} user={user} reload={reload} toast={toast}/>:
         pg==="clientes"?<Clientes clients={clients} orders={orders} reload={reload} toast={toast}/>:
         pg.startsWith("prod:")?<Catalogo key={pg} products={products} cats={cats} opciones={opciones} rate={rate} reload={reload} toast={toast} catFilter={pg.slice(5)} go={go}/>:
         pg==="categorias"?<Categorias cats={cats} products={products} reload={reload} toast={toast}/>:
         <Ajustes toast={toast} vendedores={vendedores} reload={reload}/>}
      </div>
    </div>
    {toastEl}
  </div>;
}

function Root(){
  const [session,setSession]=useState(undefined),[perfil,setPerfil]=useState(null);
  useEffect(()=>{if(!db)return;db.auth.getSession().then(({data})=>setSession(data.session));
    const {data}=db.auth.onAuthStateChange((_e,s)=>setSession(s));return()=>data.subscription.unsubscribe()},[]);
  useEffect(()=>{if(!db)return;if(!session){setPerfil(null);return}
    let ok=true;
    (async()=>{
      const {data,error}=await db.rpc("panel_mi_perfil");
      if(!ok) return;
      if(!error) return setPerfil(data||false);
      /* base sin actualizar: se cae al control clásico de administradores */
      const r=await db.from("admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
      if(ok) setPerfil(r.data?{rol:"admin",nombre:session.user.email}:false);
    })();
    return()=>{ok=false}},[session&&session.user.id]);
  if(!db) return <NoConfig/>;
  if(session===undefined||(session&&perfil===null)) return <p className="emp" style={{padding:"30vh 0"}}>Cargando…</p>;
  if(!session) return <Login/>;
  if(!perfil) return <NoAccess user={session.user}/>;
  return <Panel user={session.user} perfil={perfil}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
