<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel · Catálogo Mayorista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#08090a;--side:#0c0d0e;--card:#101112;--card2:#151718;--line:#1f2224;--txt:#f1f2f3;--mut:#8b9096;--green:#22d67a;--gold:#f5b82e;--red:#ff5a5f;--blue:#3b8bff;--violet:#a78bfa}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside.side{background:var(--side);border-right:1px solid var(--line);padding:18px 10px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;padding:0 10px 18px}
.logo span{width:36px;height:36px;border-radius:10px;background:#0a1d13;border:1px solid #14432b;display:grid;place-items:center;color:var(--green);font-size:18px}
.grp{font-size:12px;color:var(--mut);font-weight:700;padding:14px 12px 6px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;color:#d7dadd;text-align:left}
.nv:hover{background:var(--card2)}
.nv.on{background:#0e2a1b;color:var(--green)}
.nv.sub{padding-left:40px;font-size:13.5px}
.nv svg{font-size:17px}
.me{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.me b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--mut);font-size:11px}
.me .r{display:flex;gap:6px;margin-top:10px}
.me .r a,.me .r button{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;place-items:center;font-size:12px;font-weight:700;gap:4px;grid-auto-flow:column}
.me .r a:hover,.me .r button:hover{border-color:var(--green);color:var(--green)}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;height:60px;padding:0 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,9,10,.92);backdrop-filter:blur(8px);z-index:10}
.top h1{font-size:18px;font-weight:800}
.menu{display:none;font-size:20px}
.tag{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:800;background:var(--card)}
.tag b{color:var(--green)}
.content{padding:20px 24px 60px;max-width:1500px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.hd h2{font-size:18px;font-weight:800}
.hd .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 13px;font-weight:700;font-size:13px}
.btn:hover{border-color:#34393d}
.btn.p{background:var(--green);color:#03170c;border-color:var(--green)}
.btn.p:hover{filter:brightness(1.08)}
.btn.d{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sel,.inp{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;width:100%}
.sel{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--c,var(--green)),transparent)}
.kpi h4{font-size:11px;letter-spacing:1.2px;color:var(--mut);font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.kpi h4 i{width:24px;height:24px;border-radius:7px;background:var(--card2);display:grid;place-items:center;font-style:normal;color:var(--c,var(--green))}
.kpi .v{font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.kpi small{color:var(--mut);font-size:11.5px}
.big{border:1.5px solid var(--green);border-radius:14px;padding:18px 22px;background:linear-gradient(90deg,rgba(34,214,122,.10),transparent 70%),var(--card);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.big h4{font-size:12px;letter-spacing:1.2px;font-weight:800;color:#cfd3d6}
.big .n{font-size:44px;font-weight:800;color:var(--green);line-height:1.1;margin:4px 0}
.big small{color:var(--mut);font-size:12px}
.brk{display:flex;gap:22px;flex-wrap:wrap}
.brk div small{display:block;text-transform:uppercase;font-size:10px;letter-spacing:.8px}
.brk div b{font-size:22px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.box h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
.box .s{color:var(--mut);font-size:12px;margin:3px 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--bg)}
.seg button{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:700;color:var(--mut)}
.seg .on{background:#0e2a1b;color:var(--green)}
.chart{display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:10px}
.bar{flex:1;min-width:2px;background:linear-gradient(var(--green),#0f6b3e);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bar:hover{filter:brightness(1.25)}
.axis{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:6px}
.emp{color:var(--mut);text-align:center;padding:34px 0;font-size:13px}
.rank{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.rank:first-of-type{border-top:0}
.rank .t{height:5px;background:var(--line);border-radius:3px;margin-top:5px}
.rank .t i{display:block;height:100%;background:var(--green);border-radius:3px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#131516}
.thumb{width:44px;height:44px;border-radius:8px;background:#1b1d1f;object-fit:contain;display:grid;place-items:center}
.mut{color:var(--mut)}.g{color:var(--green)}.au{color:var(--gold)}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;border:1px solid}
.st-pendiente{color:var(--gold);border-color:#5a4410;background:#1d1708}
.st-confirmado{color:var(--blue);border-color:#143d78;background:#0a1830}
.st-enviado{color:var(--violet);border-color:#43377a;background:#15112b}
.st-entregado{color:var(--green);border-color:#14582f;background:#0a2013}
.st-cancelado{color:var(--red);border-color:#6a2023;background:#250d0e}
.sw{width:38px;height:22px;border-radius:12px;background:var(--line);position:relative;transition:.15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--green)}.sw.on:after{left:19px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.ib{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:14px}
.ib:hover{border-color:var(--green);color:var(--green)}.ib.d:hover{border-color:var(--red);color:var(--red)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700}
.chip.on{border-color:var(--green);color:var(--green);background:#0b1c13}
.det td{background:#0d0e0f!important;padding:16px 22px}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:grid;place-items:start center;overflow:auto;padding:30px 12px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(720px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px}
.mb{padding:18px 20px;display:grid;gap:14px}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.f label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.help{font-size:11.5px;color:var(--mut);margin-top:5px}
.trow{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:8px;margin-bottom:8px}
.imgrow{display:flex;gap:12px;align-items:center}
.imgrow .thumb{width:72px;height:72px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0e2a1b;border:1px solid var(--green);color:var(--green);padding:11px 18px;border-radius:10px;font-weight:700;z-index:99;font-size:13px}
.toast.err{background:#250d0e;border-color:var(--red);color:var(--red)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.lbox h1{font-size:22px;margin:14px 0 4px}
.lbox p{color:var(--mut);font-size:13px;margin-bottom:18px}
.lbox .f{margin-bottom:14px}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;font-size:12px;overflow:auto;white-space:pre-wrap;margin:10px 0}
/* cotizaciones */
.rates{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.rates::-webkit-scrollbar{display:none}
.rc{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.rc span{color:var(--mut)}
.rc b{color:var(--txt)}
.rc.hot{border-color:#14432b;background:#0b1c13}
.rc.hot b{color:var(--green)}
.rc .rf{color:var(--green);display:inline-flex;font-size:13px}
.rc .rf.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rc input{width:44px;background:none;border:0;color:var(--green);font-weight:800;font-size:12px;text-align:right;padding:0}
.rc input:focus-visible{outline:none}
.rc select{background:none;border:0;color:var(--mut);font-weight:800;font-size:12px;padding:0;max-width:92px}
.rc select option{background:#111;color:#fff}
.sep{width:1px;height:20px;background:var(--line);flex:none;margin:0 2px}
/* inventario */
.hide-money .money{filter:blur(7px);user-select:none}
.catb{display:inline-block;background:#1b1f22;border-radius:6px;font-size:11px;font-weight:700;padding:3px 9px;color:#d3d7da}
.invbox{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:rgba(255,255,255,.015)}
.invt{display:flex;align-items:center;gap:8px;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;margin-bottom:12px}
.invt small{color:var(--mut);font-weight:600;text-transform:none;letter-spacing:0;font-size:11.5px}
.invt b{font-size:13px}
.invh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.invbtns{display:flex;gap:8px;flex-wrap:wrap}
.inv3{display:grid;grid-template-columns:1.1fr 1.1fr 1fr;gap:14px;align-items:start}
.vlh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;min-height:30px}
.vlh .vl{margin:0}
.vl.sm{font-size:9.5px}
.sfx{position:relative}.sfx .inp{padding-right:44px;font-weight:800}
.sfx span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:12px;font-weight:700;pointer-events:none}
.iph{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;max-height:340px;overflow:auto}
.ichk{display:flex;align-items:center;gap:9px;font-size:13px;padding:7px 8px;border-radius:8px;cursor:pointer}
.ichk:hover{background:var(--card2)}.ichk.dis{opacity:.45;cursor:default}
.ichk input{accent-color:#22d67a;width:15px;height:15px}
@media(max-width:800px){.inv3{grid-template-columns:1fr}.iph{grid-template-columns:1fr}}
/* menú desplegable */
.nv .chev{margin-left:auto;font-size:15px;transition:transform .15s;opacity:.7}
.nv .chev.open{transform:rotate(180deg)}
.nv.grp-on{color:var(--green)}
.nv.sub svg{font-size:15px}
@media(prefers-reduced-motion:reduce){.nv .chev{transition:none}}
/* configuración: cotización, comisiones, usuarios */
.modal.clean .mh{border-bottom:0;padding-bottom:4px;font-size:17px}
.ulab{display:block;font-size:11px;letter-spacing:.9px;font-weight:800;text-transform:uppercase;color:#c4c8cc;margin-bottom:8px}
.uinfo{background:#141617;border-radius:10px;padding:12px 14px;color:var(--mut);font-size:12px;line-height:1.55}
.unote{background:#2a2208;border:1px solid #5a4410;border-radius:10px;padding:12px 14px;color:var(--gold);font-size:12.5px;font-weight:700;line-height:1.5}
.uft{display:flex;justify-content:flex-end;gap:10px;margin-top:2px}
.gban{display:flex;align-items:center;gap:16px;border:1px solid #5a4410;background:linear-gradient(90deg,rgba(245,184,46,.13),rgba(245,184,46,.04)),#1a1507;border-radius:14px;padding:20px 22px;margin-bottom:18px}
.gban>svg{font-size:18px;color:#fff;fill:#fff;stroke:#fff}
.gban b{display:block;color:var(--gold);font-size:13px;margin-bottom:3px}
.gban span{color:#d7dadd;font-size:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;width:min(396px,100%);margin-bottom:18px}
.pcard h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.pcard h3 svg{color:var(--gold)}
.pcard>p{color:var(--mut);font-size:12px;margin:5px 0 16px}
.pcard .f{margin-bottom:14px}
.pcard .inp{padding:12px 14px}
.urow{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:10px;flex-wrap:wrap}
.av{width:36px;height:36px;border-radius:50%;border:2px solid var(--green);color:var(--green);background:#0b1c13;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.av.au{border-color:var(--gold);color:var(--gold);background:#1d1708}
.av.gy{border-color:#3a3f43;color:#c4c8cc;background:var(--card2)}
.urow .nm{flex:1;min-width:140px}.urow .nm b{display:block;font-size:15px}.urow .nm small{color:var(--mut);font-size:12.5px}
.urow .rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ub{border-radius:6px;font-size:11px;font-weight:800;padding:4px 9px;border:1px solid}
.ub.ad{color:var(--green);background:#0b2417;border-color:#14582f}
.ub.pr{color:var(--gold);background:#1d1708;border-color:#5a4410}
.ub.vd{color:#c4c8cc;background:var(--card2);border-color:var(--line)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn.rd{color:var(--red);border-color:#6a2023;background:#250d0e}
.btn.xg{color:var(--gold);border-color:#5a4410;background:transparent}
.btn.xr{color:var(--red);border-color:#6a2023;background:transparent}
.btn.rnd{border-radius:20px}
.btn.rnd.on{border-color:var(--green);color:var(--green);background:#0b1c13}
.cbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cbar .sp{flex:1}
.cpick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 6px 0 12px;color:var(--txt)}
.cpick .sel{border:0;background:none;font-weight:800;padding:9px 6px}
.cpick select option{background:#111;color:#fff}
.cstrip{display:flex;align-items:center;gap:26px;flex-wrap:wrap;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:10px;padding:12px 18px;margin-bottom:16px;font-size:11.5px;color:var(--mut)}
.cstrip b{font-size:14px;margin-left:6px;color:var(--txt)}
.cstrip .sp{flex:1}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;margin-bottom:18px}
.pbox h3{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800}
.pbox .s{color:var(--mut);font-size:12px;margin:5px 0 14px}
.prow{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:10px}
.prow .nm{flex:1}.prow .nm b{display:block;font-size:14px}.prow .nm small{color:var(--mut);font-size:12px}
.pct{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);font-size:11.5px;color:var(--mut)}
.pct b{color:var(--green);font-size:17px;margin-right:5px}
.cempty{text-align:center;padding:70px 0 40px;color:var(--mut);font-size:13px}
.cempty>svg{font-size:30px;color:#3a3f43;fill:#3a3f43;stroke:#3a3f43;margin-bottom:14px}
.cempty b{display:block;color:var(--txt);font-size:15px;margin-bottom:6px}
.cbig{border:1.5px solid #14582f;border-radius:16px;padding:20px 24px 22px;margin-bottom:22px;background:radial-gradient(120% 140% at 0% 0%,rgba(34,214,122,.10),transparent 60%),var(--card)}
.cbig h4{font-size:10.5px;letter-spacing:1.4px;color:var(--green);font-weight:800;text-transform:uppercase}
.cbig .n{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:8px 0 12px}
.cbig .n b{font-size:42px;font-weight:800;letter-spacing:-.02em}
.cbig .n span{color:#c4c8cc;font-size:12.5px}
.cbig p{color:var(--mut);font-size:11.5px}
.cbig p b{color:#d7dadd}
.ch2{display:flex;align-items:center;gap:12px;margin-bottom:12px}.ch2 h3{font-size:14px;font-weight:800}.ch2 .sp{flex:1}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:18px}
.cc{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;display:block}
.cc:hover{border-color:#34393d}
.cc.on{border-color:var(--green);background:#0b1c13}
.cc .ch{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:8px;color:#d7dadd}
.cc.on .ch span{color:var(--green)}
.cc .ch b{color:var(--green);font-size:10px;letter-spacing:.6px}
.cc .cv{font-size:22px;font-weight:800;letter-spacing:-.02em}
.cc small{display:block;color:var(--mut);font-size:10.5px;margin-top:5px}
.rf.spin svg{animation:sp .8s linear infinite}

function useToast(){const [t,set]=useState(null);const show=(msg,err)=>{set({msg,err});setTimeout(()=>set(null),3200)};

/* Comprime la imagen a 900px antes de subirla (más rápida para el cliente) */
async function shrink(file,max=900){
  const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r(b),"image/webp",.85));
}
async function uploadImage(file,folder,max=1200){
  const blob=await shrink(file,max);const ext=blob.type==="image/webp"?"webp":"png";
  const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {error}=await db.storage.from("productos").upload(path,blob,{contentType:blob.type});
  if(error) throw error;
  return db.storage.from("productos").getPublicUrl(path).data.publicUrl;
}

  return <div className="veil" onMouseDown={e=>e.target===e.currentTarget&&onClose()}>
    <div className={"modal"+(clean?" clean":"")} style={w?{width:`min(${w}px,100%)`,marginTop:mt||0}:null} role="dialog" aria-label={title}>
      <div className="mh"><span>{title}</span><button className="ib" onClick={onClose} aria-label="Cerrar"><Ic n="x"/></button></div>
      <div className="mb">{children}</div>{foot&&<div className="mf">{foot}</div>}
    </div></div>;
}

/* =====================  COTIZACIONES EN VIVO  ===================== */
async function fetchRates(){
  const get=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
  const [d,e,b]=await Promise.allSettled([get("https://dolarapi.com/v1/dolares"),get("https://dolarapi.com/v1/cotizaciones/eur"),get("https://dolarapi.com/v1/cotizaciones/brl")]);
  if(d.status!=="fulfilled"&&e.status!=="fulfilled"&&b.status!=="fulfilled") throw new Error("sin datos");
  const m={};if(d.status==="fulfilled") d.value.forEach(x=>{m[x.casa]=x});
  return {...m,eur:e.status==="fulfilled"?e.value:null,brl:b.status==="fulfilled"?b.value:null};
}
const money=x=>x?"$"+Number(x).toLocaleString("es-AR",{maximumFractionDigits:2}):"—";
const BASE_LIST=[["oficial","Oficial"],["blue","Blue"],["bolsa","MEP / Bolsa"],["contadoconliqui","CCL"],["mayorista","Mayorista"],["cripto","Cripto (USDT)"],["tarjeta","Tarjeta"],["manual","Manual"]];
const BASES=Object.fromEntries(BASE_LIST);
const COT0={base:"cripto",interes:1.5,valor:0,auto:true,manual:"",respaldo:1500};
/* Dólar en uso = valor de venta de la fuente elegida + % (o el valor manual, tal cual) */
function cotCompute(rates,c){
  if(c.base==="manual") return Math.round(num(c.manual))||0;
  const x=rates&&rates[c.base]&&Number(rates[c.base].venta);
  return x?Math.round(x*(1+num(c.interes)/100)):0;
}
function useCotizacion(toast,canSave){
  const [cfg,setCfg]=useState(COT0),[r,setR]=useState(null),[busy,setBusy]=useState(false);
  const ref=useRef(cfg);ref.current=cfg;
  const save=async c=>{
    const {error}=await db.from("ajustes").upsert({clave:"cotizacion",valor:{...c,actualizado:new Date().toISOString()}});
    if(error) toast("No se pudo guardar la cotización: "+error.message,1); else setCfg(c);
  };
  const refresh=async force=>{
    if(!canSave) return;
    setBusy(true);let rates=null;
    try{rates=await fetchRates();setR(rates)}catch{if(force)toast("No se pudo consultar la cotización en vivo",1)}
    const c=ref.current;let v=cotCompute(rates,c);
    if(!v&&!c.valor) v=Math.round(num(c.respaldo)); /* si la API no responde, se usa el dólar de respaldo */
    if(v&&(force||c.auto)&&v!==c.valor) await save({...c,valor:v});
    if(force&&rates) toast("Cotización actualizada");
    setBusy(false);
  };
  const commit=patch=>{const c={...ref.current,...patch};const v=cotCompute(r,c)||c.valor;return save({...c,valor:v})};
  useEffect(()=>{
    db.from("ajustes").select("valor").eq("clave","cotizacion").maybeSingle().then(({data})=>{
      const c={...COT0,...((data&&data.valor)||{})};setCfg(c);ref.current=c;refresh(false)});
    if(!canSave) return;

/* Gráfico de área: cierre diario de los últimos 45 días */
function DolarChart({hist}){
  if(hist===null) return <p className="emp">Cargando historial…</p>;
  if(!hist.length) return <p className="emp">No se pudo cargar el historial</p>;
  const W=1000,H=250,L=64,R=16,T=14,B=34,pw=W-L-R,ph=H-T-B,n=hist.length;
  const mx=Math.max(...hist.map(d=>d.v)),top=Math.max(4,Math.ceil(mx*1.156));
  const X=i=>L+(n===1?pw:pw*i/(n-1)),Y=v=>T+ph-ph*v/top;
  const pts=hist.map((d,i)=>`${X(i).toFixed(1)},${Y(d.v).toFixed(1)}`);
  const line="M"+pts.join("L"),area=`${line}L${X(n-1).toFixed(1)},${T+ph}L${X(0).toFixed(1)},${T+ph}Z`;
  const ticks=[0,1,2,3,4].map(i=>Math.round(top*i/4));
  const idx=[];for(let i=0;i<n;i+=6)idx.push(i);if(idx[idx.length-1]!==n-1)idx.push(n-1);
  const dm=f=>`${String(f).slice(8,10)}/${String(f).slice(5,7)}`;
  return <svg className="dchart" viewBox={`0 0 ${W} ${H}`} role="img" aria-label="Evolución del dólar en los últimos 45 días">
    <defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#22d67a" stopOpacity=".45"/><stop offset="1" stopColor="#22d67a" stopOpacity=".05"/></linearGradient></defs>
    {ticks.map(t=><g key={t}><line x1={L} x2={W-R} y1={Y(t)} y2={Y(t)} stroke="#1f2224" strokeWidth="1"/>
      <text x={L-10} y={Y(t)+4} textAnchor="end" fontSize="11" fill="#8b9096" fontFamily="ui-monospace,Menlo,monospace">{"$"+t.toLocaleString("es-AR")}</text></g>)}
    <path d={area} fill="url(#dg)"/><path d={line} fill="none" stroke="#22d67a" strokeWidth="2" strokeLinejoin="round"/>
    {idx.map(i=><text key={i} x={X(i)} y={H-10} textAnchor={i===0?"start":i===n-1?"end":"middle"} fontSize="11" fill="#8b9096" fontFamily="ui-monospace,Menlo,monospace">{dm(hist[i].f)}</text>)}
    {hist.map((d,i)=><circle key={i} cx={X(i)} cy={Y(d.v)} r="7" fill="transparent"><title>{`${dm(d.f)}: ${money(d.v)}`}</title></circle>)}
    <circle cx={X(n-1)} cy={Y(hist[n-1].v)} r="4.5" fill="#0c0d0e" stroke="#22d67a" strokeWidth="2"/>
  </svg>;
}

/* =====================  PDF DE STOCK (color x talle)  ===================== */
const TALLE_ORDER=["XXS","XS","S","M","L","XL","XXL","XXXL","2XL","3XL","4XL","UNICO","ÚNICO","U"];
function sortTalles(arr){
  const f=t=>parseFloat(String(t.l).replace(",","."));
  if(arr.every(t=>!isNaN(f(t)))) return [...arr].sort((a,b)=>f(a)-f(b));
  const rank=t=>{const i=TALLE_ORDER.indexOf(String(t.l).toUpperCase());return i<0?999:i};
  return arr.map((t,i)=>({t,i})).sort((a,b)=>rank(a.t)-rank(b.t)||a.i-b.i).map(x=>x.t);
}
/* Arma la matriz color x talle de un producto: cada celda es el stock de esa combinación */
function variantMatrix(p){
  const vs=(p.variantes||[]).filter(v=>String(v.color||"").trim()||String(v.talle||"").trim());
  if(!vs.length) return {colors:[{k:"",l:"Sin variantes"}],talles:[{k:"",l:"Stock"}],map:{"|":p.stock==null?null:Number(p.stock)}};
  const colors=[],talles=[],map={};
  vs.forEach(v=>{const c=String(v.color||"").trim(),t=String(v.talle||"").trim(),kc=c.toLowerCase(),kt=t.toLowerCase();
    if(!colors.find(x=>x.k===kc)) colors.push({k:kc,l:c||"—"});
    if(!talles.find(x=>x.k===kt)) talles.push({k:kt,l:t||"—"});
    map[kc+"|"+kt]=(map[kc+"|"+kt]||0)+(Number(v.stock)||0)});
  return {colors,talles:sortTalles(talles),map};
}
function stockPdf({titulo,groups}){
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J) throw new Error("no cargó el generador de PDF (revisá tu conexión)");
  const doc=new J({unit:"mm",format:"a4"});
  const PW=210,PH=297,M=10,UW=PW-2*M,RH=6.5,NAMEW=24,RED=[192,0,0],YEL=[255,192,0];
  let y=M;
  doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(20,20,20);doc.text(titulo,M,y+5);
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(110,110,110);
  doc.text(`Generado el ${new Date().toLocaleDateString("es-AR")}  ·  Stock por color y talle  ·  Amarillo = sin stock`,M,y+10.5);
  y+=16;

  const drawChunk=(p,m,chunk,colorW,sizeW)=>{
    const n=m.talles.length,H=(chunk.length+1)*RH;
    doc.setLineWidth(.2);doc.setDrawColor(0,0,0);
    // celda roja con el nombre (vertical, como en la planilla)
    doc.setFillColor(...RED);doc.rect(M,y,NAMEW,H,"FD");
    let fs=10,lines,lh;
    for(;;){doc.setFont("helvetica","bold");doc.setFontSize(fs);lines=doc.splitTextToSize(p.nombre,H-3);lh=fs*0.3528*1.2;
      if(lines.length*lh<=NAMEW-3||fs<=5.5)break;fs-=.5}
    const maxL=Math.max(1,Math.floor((NAMEW-3)/lh));
    if(lines.length>maxL){lines=lines.slice(0,maxL);lines[maxL-1]=lines[maxL-1].slice(0,-3)+"..."}
    doc.setTextColor(255,255,255);
    lines.forEach((ln,i)=>{const w=doc.getTextWidth(ln);doc.text(ln,M+(NAMEW-lines.length*lh)/2+lh*(i+.78),y+H/2+w/2,{angle:90})});
    // fila de talles
    doc.setFillColor(...RED);doc.rect(M+NAMEW,y,colorW+sizeW*n,RH,"FD");
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(255,255,255);
    m.talles.forEach((t,j)=>doc.text(String(t.l),M+NAMEW+colorW+sizeW*j+sizeW/2,y+RH/2+1.2,{align:"center"}));
    // filas de colores
    chunk.forEach((c,r)=>{const yy=y+RH*(r+1);
      doc.setFillColor(255,255,255);doc.rect(M+NAMEW,yy,colorW,RH,"FD");
      doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(0,0,0);
      doc.text(doc.splitTextToSize(c.l,colorW-3)[0],M+NAMEW+1.5,yy+RH/2+1.2);
      m.talles.forEach((t,j)=>{const v=m.map[c.k+"|"+t.k],x=M+NAMEW+colorW+sizeW*j,out=v===0;
        doc.setFillColor(...(out?YEL:[255,255,255]));doc.rect(x,yy,sizeW,RH,"FD");
        if(v!==undefined){doc.setFont("helvetica",out?"bold":"normal");doc.setTextColor(0,0,0);doc.text(v===null?"-":String(v),x+sizeW/2,yy+RH/2+1.2,{align:"center"})}});
    });
    y+=H;
  };

  for(const g of groups){
    if(g.heading){if(y+14>PH-M){doc.addPage();y=M}
      doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(192,0,0);doc.text(g.heading.toUpperCase(),M,y+5);y+=8}
    for(const p of g.items){
      const m=variantMatrix(p),n=m.talles.length;
      doc.setFont("helvetica","bold");doc.setFontSize(9);
      const colorW=Math.min(60,Math.max(30,Math.max(...m.colors.map(c=>doc.getTextWidth(c.l)))+6));
      const sizeW=Math.min(16,Math.max(7,(UW-NAMEW-colorW)/n));
      let i=0;
      while(i<m.colors.length){
        let fit=Math.floor((PH-M-y)/RH)-1;
        if(fit<Math.min(2,m.colors.length-i)){doc.addPage();y=M;fit=Math.floor((PH-2*M)/RH)-1}
        const chunk=m.colors.slice(i,i+fit);drawChunk(p,m,chunk,colorW,sizeW);i+=chunk.length;
      }
      y+=3;
    }
  }
  const total=doc.getNumberOfPages();
  for(let i=1;i<=total;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(120,120,120);doc.text(`Página ${i} de ${total}`,PW-M,PH-5,{align:"right"})}
  return doc;
}

/* Variantes <-> tabla (filas = colores, columnas = talles, celdas = stock) */
const same=(a,b)=>String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();
function tablaFrom(vs){
  if(!vs||!vs.length) return null;
  const colores=[],tl=[];
  vs.forEach(v=>{const c=String(v.color||"").trim(),t=String(v.talle||"").trim();
    if(!colores.some(x=>same(x,c)))colores.push(c);if(!tl.some(x=>same(x,t)))tl.push(t)});
  const talles=sortTalles(tl.map(l=>({l:l||"—",raw:l}))).map(x=>x.raw);
  const stock=colores.map(c=>talles.map(t=>{const hit=vs.filter(v=>same(v.color,c)&&same(v.talle,t));
    return hit.length?String(hit.reduce((s,v)=>s+(Number(v.stock)||0),0)):""}));
  return {colores,talles,stock};
}

const REGLAS0={moneda:"USD",suma:true,cant:[1,3,5,10],
  USD:[{hasta:10,g:[4,3,2.5,2]},{hasta:30,g:[6,5,4,3.5]},{hasta:100,g:[10,8,7,6]},{hasta:null,g:[15,12,10,9]}],
  ARS:[{hasta:10000,g:[4000,3000,2500,2000]},{hasta:30000,g:[6000,5000,4000,3500]},{hasta:100000,g:[10000,8000,7000,6000]},{hasta:null,g:[15000,12000,10000,9000]}]};
const reglasDe=(all,slug)=>({...REGLAS0,...((all&&all["*"])||{}),...((all&&all[slug])||{})});
const fmt2=v=>Number(v||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const costoUsd=(p,rate)=>p.moneda==="ARS"&&p.costo_ars!=null&&Number(rate)>0?Number(p.costo_ars)/Number(rate):Number(p.costo_usdt||0);
function ruleRow(r,c){const rows=r[r.moneda]||[];return rows.find(x=>x.hasta==null||x.hasta===""||c<=Number(x.hasta))||rows[rows.length-1]||null}
/* precio unitario para la cantidad nº i según las reglas (costo en USDT) */
function precioRegla(r,cUsd,rate,i){
  if(!(cUsd>0)||!(rate>0)) return null;
  if(r.moneda==="ARS"){const c=cUsd*rate,row=ruleRow(r,c);if(!row)return null;
    const a=Math.round(c+(num(row.g[i])||0));return {ars:a,usd:+(a/rate).toFixed(2),gan:num(row.g[i])||0}}
  const row=ruleRow(r,cUsd);if(!row)return null;
  const u=+(cUsd+(num(row.g[i])||0)).toFixed(2);return {usd:u,ars:Math.round(u*rate),gan:num(row.g[i])||0};
}
function patchRegla(r,p,rate,catName){
  const c=costoUsd(p,rate);if(!(c>0)||!(rate>0)) return null;
  const ps=r.cant.map((q,i)=>({q:Math.round(num(q)),...precioRegla(r,c,rate,i)})).filter(x=>x.q>0&&x.usd>0).sort((a,b)=>a.q-b.q);
  if(!ps.length) return null;
  const base=ps.find(x=>x.q===1)||ps[0],rest=ps.filter(x=>x!==base&&x.q>1);
  const fixed=r.moneda==="ARS";
  const patch={precio_usdt:base.usd,precio_ars:fixed?base.ars:null,
    tramos:rest.map(x=>({min:x.q,usdt:x.usd,...(fixed?{ars:x.ars}:{})}))};
  if(r.suma&&!p.grupo_combinado) patch.grupo_combinado=catName;
  return patch;
}
/* escalones de precio de un producto: [{q,usd,ars}] incluyendo x1 */
function tiersOf(p,rate){
  const toU=(u,a)=>p.moneda==="ARS"&&a&&rate?a/rate:Number(u),toA=(u,a)=>a!=null&&a!==""?Number(a):(rate?Math.round(Number(u)*rate):null);
  const base={q:1,usd:priceUsd(p,rate),ars:toA(p.precio_usdt,p.precio_ars)};
  const rest=(p.tramos||[]).filter(t=>Number(t.min)>1).map(t=>({q:Number(t.min),usd:toU(t.usdt,t.ars),ars:toA(t.usdt,t.ars)}));
  return [base,...rest].sort((a,b)=>a.q-b.q);
}
const copyText=async(t,toast,ok)=>{try{await navigator.clipboard.writeText(t);toast(ok||"Copiado")}catch(e){toast("No se pudo copiar",1)}};
const msgCat=(p,rate,n,hideStock)=>{
  const T=tiersOf(p,rate),sub=[p.marca,p.subcategoria].filter(Boolean).join(" · ");
  const line=t=>`${t.q===1?"x1":"x"+t.q}: ${usd(t.usd).replace("USDT ","USDT ")}${t.ars?" · "+ars(t.ars):""}`;
  if(n===1) return `*${p.nombre}*\n${T.map(line).join("\n")}`;
  if(n===2) return `*${p.nombre}*${sub?"\n"+sub:""}${p.descripcion?"\n"+p.descripcion:""}\n\n${T.map(line).join("\n")}${!hideStock&&p.stock!=null&&!p.sin_stock?"\n\nStock disponible: "+p.stock+" u":""}`;
  return `🔥 *${p.nombre}* 🔥\n${sub?sub+"\n":""}${p.descripcion?p.descripcion+"\n":""}\n💰 Precios mayoristas:\n${T.map(line).join("\n")}\n\n${p.sin_stock?"⚠️ Sin stock por el momento":"✅ Disponible"} · Envíos a todo el país 📦\nEscribime y te lo reservo.`;
};
/* imagen lista para pegar en WhatsApp */
async function cardPng(p,rate){
  const W=900,T=tiersOf(p,rate),H=640+T.length*74;
  const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,W,H);
  const src=(p.imagenes&&p.imagenes[0])||p.imagen_url;
  if(src){try{const img=await new Promise((ok,no)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>ok(i);i.onerror=no;i.src=src});
    const s=Math.min(560/img.width,560/img.height);g.drawImage(img,(W-img.width*s)/2,30,img.width*s,img.height*s)}catch(e){}}
  g.fillStyle="#111";g.font="800 40px sans-serif";g.textAlign="center";
  const words=p.nombre.split(" ");let line="",y=640;const lines=[];
  words.forEach(w=>{const t=line?line+" "+w:w;if(g.measureText(t).width>820&&line){lines.push(line);line=w}else line=t});lines.push(line);
  lines.slice(0,2).forEach(l=>{g.fillText(l,W/2,y);y+=48});
  g.font="700 34px sans-serif";y+=14;
  T.forEach(t=>{g.fillStyle="#0a8f4d";g.fillText(`${t.q===1?"x1":"x"+t.q}  ·  ${usd(t.usd)}${t.ars?"  ·  "+ars(t.ars):""}`,W/2,y);y+=60});
  return await new Promise(ok=>c.toBlob(ok,"image/png"));
}
const copyImg=async(p,rate,toast)=>{
  try{const b=await cardPng(p,rate);
    if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({"image/png":b})]);toast("Imagen copiada · pegala en WhatsApp")}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=slugify(p.nombre)+".png";a.click();toast("Tu navegador no copia imágenes: se descargó")}
  }catch(e){toast("No se pudo copiar la imagen: "+e.message,1)}
};

  const catName=(cats.find(c=>c.slug===f.categoria)||{}).nombre||"";
  const ARS_=f.moneda==="ARS",unit=ARS_?"$":"U$D";
  const inv=f.inventario_id?products.find(p=>p.id===f.inventario_id):null;
  /* costo: si está vinculado manda el inventario */
  const costoM=inv?(ARS_?(inv.costo_ars!=null?Number(inv.costo_ars):(rate?Number(inv.costo_usdt||0)*rate:0)):Number(inv.costo_usdt||0)):num(f.costo);
  const priceOf=fl=>{const v=num(fl.valor);return fl.modo==="ganancia"?costoM+v:fl.modo==="margen"?costoM*(1+v/100):v};
  const showRes=p=>{if(!(p>0))return "—";const u=ARS_?(rate?p/rate:0):p,a=ARS_?p:(rate?p*rate:0);return `${usd(u)}${a?" · "+ars(a):""}`};
  const setFila=(i,k,v)=>set("filas",f.filas.map((x,j)=>j===i?{...x,[k]:v}:x));
  const fromRules=()=>{
    if(!(costoM>0)||!(rate>0)) return toast("Cargá el costo (o vinculá el inventario) para usar las reglas",1);
    const cU=ARS_?costoM/rate:costoM,r={...reglas,moneda:f.moneda};
    const fl=r.cant.map((q,i)=>{const x=precioRegla(r,cU,rate,i);return x?{min:String(Math.round(num(q))),modo:"precio",valor:ARS_?String(x.ars):String(x.usd)}:null}).filter(Boolean).sort((a,b)=>num(a.min)-num(b.min));
    if(!fl.length) return toast("Las reglas no devolvieron precios",1);
    set("filas",fl);toast("Precios cargados desde las reglas");
  };
  /* vínculo con el inventario */
  const candidates=products.filter(p=>!p.inventario_id&&p.id!==f.id).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  const link=id=>{
    if(!id) return setF(s=>({...s,inventario_id:""}));
    const p=products.find(x=>x.id===id);if(!p) return;
    setF(s=>({...s,inventario_id:id,nombre:s.nombre||p.nombre,sku:s.sku||p.sku||"",categoria:s.id?s.categoria:(p.categoria||s.categoria),marca:s.marca||p.marca||"",subcategoria:s.subcategoria||p.subcategoria||"",
      imagenes:s.imagenes.length?s.imagenes:(p.imagenes&&p.imagenes.length?p.imagenes:(p.imagen_url?[p.imagen_url]:[])).slice(0,4),
      moneda:p.moneda==="ARS"?"ARS":s.moneda}));
  };
  const optList=tipo=>{
    const saved=[...opciones,...added].filter(o=>o.categoria===f.categoria&&o.tipo===tipo).map(o=>o.valor);
    const used=products.filter(p=>p.categoria===f.categoria).map(p=>p[tipo]);
    return [...new Set([...saved,...used,f[tipo]].filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
  };
  const addOpt=async v=>{
    const {tipo}=newOpt,valor=v.trim();if(!valor)return;
    const {error}=await db.from("catalogo_opciones").insert({categoria:f.categoria,tipo,valor});
    if(error&&error.code!=="23505") return toast("No se pudo guardar: "+error.message,1);
    setAdded(a=>[...a,{categoria:f.categoria,tipo,valor}]);set(tipo,valor);setNewOpt(null);toast(`${tipo==="marca"?"Marca":"Subcategoría"} “${valor}” guardada`);onOpt&&onOpt();
  };
  const addImgs=urls=>setF(s=>({...s,imagenes:[...s.imagenes,...urls].slice(0,4)}));
  const pick=async e=>{const files=[...e.target.files].slice(0,4-f.imagenes.length);e.target.value="";if(!files.length)return;setUp(true);
    const ok=[];for(const file of files){try{ok.push(await uploadImage(file,"productos"))}catch(err){toast("No se pudo subir una imagen: "+err.message,1)}}
    addImgs(ok);setUp(false)};

  const save=async()=>{
    if(!f.nombre.trim()) return toast("Poné un nombre",1);
    if(!f.categoria) return toast("Elegí una categoría",1);
    const filas=f.filas.map(x=>({...x,q:Math.round(num(x.min)),p:priceOf(x)})).filter(x=>x.q>0&&x.p>0);
    const base=filas.find(x=>x.q===1);
    if(!base) return toast("Cargá el precio de 1 unidad (cant. 1) en Precios por volumen",1);
    const toU=p=>ARS_?(rate?+(p/rate).toFixed(2):0):+p.toFixed(2);
    if(ARS_&&!(rate>0)) return toast("Falta la cotización para convertir a dólares",1);
    const tramos=filas.filter(x=>x.q>1).sort((a,b)=>a.q-b.q).map(x=>({min:x.q,usdt:toU(x.p),...(ARS_?{ars:Math.round(x.p)}:{}),modo:x.modo,valor:num(x.valor),moneda:f.moneda}));
    const cU=ARS_?(rate?costoM/rate:0):costoM;
    const row={nombre:f.nombre.trim(),sku:f.sku.trim(),categoria:f.categoria,marca:f.marca.trim(),subcategoria:f.subcategoria.trim(),descripcion:f.descripcion.trim(),
      imagenes:f.imagenes,imagen_url:f.imagenes[0]||"",moneda:f.moneda,precio_usdt:toU(base.p),precio_ars:ARS_?Math.round(base.p):null,tramos,
      precio_mentoria:num(f.mentoria)>0?num(f.mentoria):null,activo:f.activo,orden:Math.round(num(f.orden)),inventario_id:f.inventario_id||null};
    if(!inv){row.costo_usdt=+cU.toFixed(2);row.costo_ars=ARS_&&costoM>0?Math.round(costoM):null;row.stock=f.stock===""?null:Math.round(num(f.stock))}
    setBusy(true);
    const {error}=f.id?await db.from("productos").update(row).eq("id",f.id):await db.from("productos").insert(row);
    setBusy(false);
    if(error) return toast("No se pudo guardar: "+error.message+(/inventario_id|descripcion|precio_mentoria|sin_stock/.test(error.message)?" (ejecutá de nuevo supabase.sql)":""),1);
    toast(f.id?"Producto actualizado":"Producto creado");onSaved();onClose();
  };

  return <Modal title={f.id?"Editar producto":"Nuevo producto"} onClose={onClose} w={640}
    foot={<><button className="btn" onClick={onClose}>Cancelar</button><button className="btn p" onClick={save} disabled={busy||up}>{busy?"Guardando…":"Guardar"}</button></>}>
    <div className="f"><label className="ulab">Nombre</label><input className="inp" autoFocus placeholder="Ej: iPhone 15 Pro Max 256GB" value={f.nombre} onChange={e=>set("nombre",e.target.value)}/></div>
    <div className="g3">
      <div className="f"><label className="ulab">Categoría</label><select className="sel" style={{width:"100%"}} value={f.categoria} onChange={e=>setF(s=>({...s,categoria:e.target.value,marca:"",subcategoria:""}))}>
        {cats.map(c=><option key={c.slug} value={c.slug}>{c.nombre}</option>)}</select></div>
      <div className="f"><label className="ulab">Marca</label><Combo label="Marca" value={f.marca} options={optList("marca")} placeholder="Elegir marca" newLabel="Nueva marca…" onChange={v=>set("marca",v)} onNew={q=>setNewOpt({tipo:"marca",initial:q})}/></div>
      <div className="f"><label className="ulab">Subcategoría</label><Combo label="Subcategoría" value={f.subcategoria} options={optList("subcategoria")} placeholder="Elegir subcategoría" newLabel="Nueva subcategoría…" onChange={v=>set("subcategoria",v)} onNew={q=>setNewOpt({tipo:"subcategoria",initial:q})}/></div>
    </div>
    <div className="f"><label className="ulab">Descripción / aclaración</label>
      <textarea className="inp" rows="3" placeholder="Ej: Incluye cargador. Garantía 6 meses. Colores a consultar." value={f.descripcion} onChange={e=>set("descripcion",e.target.value)}/></div>
    <div className="f"><label className="ulab">Fotos (hasta 4 · la primera es la principal)</label>
      <div className="igrid" style={{gridTemplateColumns:"repeat(4,1fr)"}}>{[0,1,2,3].map(k=>{const u=f.imagenes[k];
        if(u) return <div className="islot" key={k}><img src={u} alt={`Foto ${k+1}`}/>{k===0&&<span className="bd">Principal</span>}
          <button className="ib d x" onClick={()=>set("imagenes",f.imagenes.filter((_,j)=>j!==k))} aria-label={`Quitar foto ${k+1}`}><Ic n="x"/></button></div>;
        if(k===f.imagenes.length) return <div className="islot" key={k}><label className="up" aria-label="Subir fotos">{up?"…":"+"}<input type="file" accept="image/*" multiple hidden onChange={pick}/></label></div>;
        return <div className="islot off" key={k}/>})}</div>
      {f.imagenes.length<4&&<input className="inp" style={{marginTop:10}} placeholder="…o pegá la URL de una imagen y apretá Enter" value={urlIn}
        onChange={e=>setUrlIn(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&urlIn.trim()){e.preventDefault();addImgs([urlIn.trim()]);setUrlIn("")}}}/>}</div>

    <div className="lkbox">
      <label className="ulab" style={{color:"#6db3ff"}}>Vincular con producto del inventario (opcional)</label>
      <Combo label="Producto del inventario" value={f.inventario_id} options={candidates.map(p=>({v:p.id,l:`${p.nombre}${p.stock!=null?" · Stock "+p.stock:""}`}))} placeholder="Sin vincular — elegí un producto del inventario" onChange={link}/>
      {inv?<p className="lknote">Conectado a <b>{inv.nombre}</b>: el stock ({inv.stock==null?"sin control":inv.stock+" u"}) y el costo se sincronizan solos. Cuando se vende, el stock baja en los dos lados.</p>
        :<p className="lknote">Si lo vinculás, el stock y el costo se toman del inventario y se mantienen sincronizados. Si no, el producto queda “Sin conectar al inventario”.</p>}
    </div>

    <div className="g2">
      <div className="f"><label className="ulab">Moneda</label>
        <div className="mseg" role="group" aria-label="Moneda"><button type="button" className={!ARS_?"on":""} onClick={()=>set("moneda","USD")}>Dólares (USD)</button>
          <button type="button" className={ARS_?"on":""} onClick={()=>set("moneda","ARS")}>Pesos argentinos</button></div></div>
      <div className="f"><label className="ulab">Costo por unidad ({unit}){inv&&<span className="syn"> · sincronizado</span>}</label>
        <input className="inp" inputMode="decimal" disabled={!!inv} value={inv?(costoM?(ARS_?String(Math.round(costoM)):String(costoM)):""):f.costo} placeholder="0" onChange={e=>set("costo",e.target.value)}/></div>
    </div>
    {!inv&&<div className="g2"><div className="f"><label className="ulab">Stock (vacío = sin control)</label><input className="inp" inputMode="numeric" value={f.stock} onChange={e=>set("stock",e.target.value.replace(/\D/g,""))}/></div>
      <div className="f"><label className="ulab">SKU / Código</label><input className="inp" value={f.sku} onChange={e=>set("sku",e.target.value)}/></div></div>}

    <div className="f"><label className="ulab">Precios por volumen</label>
      <div className="pv"><div className="pv-h"><span>Cant.</span><span>Cómo lo cargás</span><span>Valor</span><span>Resultado</span><span/></div>
        {f.filas.map((x,i)=><div className="pv-r" key={i}>
          <input className="inp" inputMode="numeric" aria-label="Cantidad" value={x.min} disabled={i===0} onChange={e=>setFila(i,"min",e.target.value.replace(/\D/g,""))}/>
          <select className="sel" aria-label="Cómo lo cargás" value={x.modo} onChange={e=>setFila(i,"modo",e.target.value)}>{MODOS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
          <input className="inp" inputMode="decimal" aria-label="Valor" placeholder={x.modo==="margen"?"%":unit} value={x.valor} onChange={e=>setFila(i,"valor",e.target.value)}/>
          <span className="pv-res">{showRes(priceOf(x))}</span>
          {i>0?<button className="ib d" aria-label="Quitar tramo" onClick={()=>set("filas",f.filas.filter((_,j)=>j!==i))}><Ic n="x"/></button>:<span/>}</div>)}
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:10}}>
        <button className="btn" onClick={()=>set("filas",[...f.filas,{min:"",modo:"precio",valor:""}])}><Ic n="plus"/>Agregar tramo</button>
        <button className="btn" onClick={fromRules} title="Calcula los tramos con las reglas de ganancia de la sección"><Ic n="pct"/>Cargar desde reglas</button></div>
      <p className="help">La fila de cantidad 1 es el precio minorista. “Ganancia” suma {unit} al costo; “Margen %” lo calcula sobre el costo.{rate?<> Cotización: <b className="g">{ars(rate)}</b> por USDT.</>:null}</p></div>

    <div className="mbox"><label className="ulab" style={{color:"#22d67a"}}>Precio Mentoría (opcional)</label>
      <input className="inp" inputMode="decimal" placeholder="USDT por unidad para alumnos / mentoría" value={f.mentoria} onChange={e=>set("mentoria",e.target.value)}/>
      <p className="help">Precio especial en USDT para clientes de mentoría. Queda guardado en el producto.</p></div>

    <label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",marginTop:6}}>
      <button type="button" role="switch" aria-checked={f.activo} className={"sw"+(f.activo?" on":"")} onClick={()=>set("activo",!f.activo)}/> Visible en el catálogo público</label>
    {newOpt&&<PromptModal title={`Nueva ${newOpt.tipo==="marca"?"marca":"subcategoría"}`} label={newOpt.tipo==="marca"?"Nombre de la marca":"Nombre de la subcategoría"}
      hint={`Se guarda en la sección ${catName}.`} initial={newOpt.initial} onSave={addOpt} onClose={()=>setNewOpt(null)}/>}
  </Modal>;
}

/* ---------- vista de catálogo (fotos 1 y 4) ---------- */
function Catalogo({products,cats,opciones,rate,reload,toast,catFilter,go}){
  const [q,setQ]=useState(""),[marca,setMarca]=useState(""),[edit,setEdit]=useState(null),[rg,setRg]=useState({}),[rgOpen,setRgOpen]=useState(false),[rgBusy,setRgBusy]=useState(false);
  const [ocStock,setOcStock]=useState(false),[tiendaV,setTiendaV]=useState({});
  useEffect(()=>{
    db.from("ajustes").select("valor").eq("clave","reglas_precio").maybeSingle().then(({data})=>setRg((data&&data.valor)||{}));
    db.from("ajustes").select("valor").eq("clave","tienda").maybeSingle().then(({data})=>{const v=(data&&data.valor)||{};setTiendaV(v);setOcStock(!!v.ocultar_stock)});
  },[]);
  const cname=s=>(cats.find(c=>c.slug===s)||{}).nombre||s;
  const slug=catFilter||"*",catName=catFilter?cname(catFilter):"";
  const R=reglasDe(rg,slug);
  const all=products.filter(p=>!p.solo_inventario);
  const inCat=all.filter(p=>!catFilter||p.categoria===catFilter).sort((a,b)=>(a.orden-b.orden)||String(b.created_at).localeCompare(String(a.created_at)));
  const marcas=[...new Set(inCat.map(p=>p.marca).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
  const list=inCat.filter(p=>(!marca||p.marca===marca)&&(!q||(p.nombre+" "+p.marca+" "+p.subcategoria).toLowerCase().includes(q.toLowerCase())));
  const compact=/electr/i.test(catName);
  const upd=async(p,patch,ok)=>{const {error}=await db.from("productos").update(patch).eq("id",p.id);error?toast("No se pudo actualizar: "+error.message,1):(ok&&toast(ok),reload())};
  const del=async p=>{if(!confirm(`¿Eliminar “${p.nombre}” del catálogo? ${p.inventario_id?"El producto del inventario no se borra. ":""}Los pedidos anteriores conservan su nombre.`))return;
    const {error}=await db.from("productos").delete().eq("id",p.id);error?toast("No se pudo eliminar: "+error.message,1):(toast("Producto eliminado"),reload())};
  const dup=async p=>{
    const {id,created_at,updated_at,...rest}=p;
    const {data,error}=await db.from("productos").insert({...rest,imeis:[],sku:"",inventario_id:null,nombre:`${p.nombre} (copia)`,activo:false}).select().single();
    if(error) return toast("No se pudo duplicar: "+error.message,1);
    await reload();toast("Copia creada (oculta). Editala y activala cuando esté lista");setEdit(data);
  };
  const move=async(p,d)=>{
    const ord=inCat.slice(),i=ord.findIndex(x=>x.id===p.id),j=i+d;if(j<0||j>=ord.length)return;
    [ord[i],ord[j]]=[ord[j],ord[i]];
    const res=await Promise.all(ord.map((x,k)=>x.orden===k*10?null:db.from("productos").update({orden:k*10}).eq("id",x.id)));
    res.some(r=>r&&r.error)?toast("No se pudo reordenar",1):reload();
  };
  const toggleStockPub=async()=>{
    const v={...tiendaV,ocultar_stock:!ocStock};
    const {error}=await db.from("ajustes").upsert({clave:"tienda",valor:v});
    if(error) return toast("No se pudo guardar: "+error.message,1);
    setTiendaV(v);setOcStock(!ocStock);toast(!ocStock?"El stock ya no se muestra al público":"El stock vuelve a mostrarse al público");
  };
  const saveRules=async(r,apply)=>{
    setRgBusy(true);
    const next={...rg,[slug]:r};
    const {error}=await db.from("ajustes").upsert({clave:"reglas_precio",valor:next});
    if(error){setRgBusy(false);return toast("No se pudieron guardar las reglas: "+error.message+" (ejecutá de nuevo supabase.sql)",1)}
    setRg(next);
    if(!apply){setRgBusy(false);return toast("Reglas guardadas")}
    let n=0,fail=0;
    for(const p of inCat){const patch=patchRegla(r,p,rate,cname(p.categoria));if(!patch)continue;
      const {error:e}=await db.from("productos").update(patch).eq("id",p.id);e?fail++:n++}
    setRgBusy(false);toast(`Reglas guardadas · precios actualizados en ${n} producto${n===1?"":"s"}${fail?` (${fail} con error)`:""}`,fail?1:0);reload();
  };
  const costEdit=async(p,cNew)=>{   /* cNew en USDT */
    const cOld=costoUsd(p,rate);if(Math.abs(cNew-cOld)<0.005)return;
    const base=p.moneda==="ARS"&&rate?{costo_ars:Math.round(cNew*rate),costo_usdt:+cNew.toFixed(2)}:{costo_usdt:+cNew.toFixed(2),costo_ars:null};
    const patch=patchRegla(reglasDe(rg,p.categoria),{...p,...base},rate,cname(p.categoria))||{};
    await upd(p,{...base,...patch},"Costo y precios actualizados");
  };
  const pdf=()=>{
    try{
      if(!list.length) return toast("No hay productos para exportar",1);
      const groups=catFilter?[{items:list}]:cats.map(c=>({heading:c.nombre,items:list.filter(p=>p.categoria===c.slug)})).filter(g=>g.items.length);
      const name=catFilter?catName:"Catálogo";
      stockPdf({titulo:`Stock · ${name}`,groups}).save(`stock-${slugify(name)}-${new Date().toISOString().slice(0,10)}.pdf`);toast("PDF descargado");
    }catch(e){toast("No se pudo generar el PDF: "+e.message,1)}
  };

  const Badge=({p})=>p.inventario_id?<span className="cbd on">Stock: {p.stock==null?"sin control":p.stock+" u"} · conectado</span>:<span className="cbd off">Sin conectar al inventario</span>;
  const Tiers=({p})=>{const T=tiersOf(p,rate).filter(t=>t.q>1);return T.length?<div className="ctr">{T.map(t=><span key={t.q}><em>x{t.q}</em> {usd(t.usd)}{t.ars?<small> · {ars(t.ars)}</small>:null}</span>)}</div>:null};

  const Full=({p,i})=>{
    const T=tiersOf(p,rate),b=T[0],c=costoUsd(p,rate),g=c>0?b.usd-c:null;
    return <div className={"ccard"+(p.activo?"":" off")}>
      <div className="cc-top">
        {(p.imagenes&&p.imagenes[0])||p.imagen_url?<img className="cc-img" src={(p.imagenes&&p.imagenes[0])||p.imagen_url} alt="" loading="lazy"/>:<span className="cc-img none">📦</span>}
        <div className="cc-b">
          <div className="cc-n"><b>{p.nombre}</b>{!p.activo&&<span className="cbd hid">Oculto</span>}{p.sin_stock&&<span className="cbd out">Sin stock</span>}</div>
          <div className="mut cc-s">{[cname(p.categoria),p.marca,p.subcategoria].filter(Boolean).join(" · ")}</div>
          {p.descripcion&&<div className="cc-d">{p.descripcion}</div>}
          <Badge p={p}/><Tiers p={p}/>
          {g!=null&&<div className="cc-g">Ganás <b>{usd(g)}</b> c/u <span className="mut">(costo {usd(c)})</span></div>}
        </div>
        <div className="cc-p"><b className="g">{usd(b.usd)}</b>{b.ars?<div className="au">{ars(b.ars)}</div>:null}
          {p.precio_mentoria!=null&&<small className="mut">Mentoría {usd(p.precio_mentoria)}</small>}</div>
      </div>
      <div className="cc-a">
        <button className="btn sm" onClick={()=>setEdit(p)}><Ic n="edit"/>Editar</button>
        <button className="btn sm" onClick={()=>upd(p,{activo:!p.activo},p.activo?"Producto ocultado":"Producto visible")}><Ic n="eye"/>{p.activo?"Ocultar":"Mostrar"}</button>
        <button className={"btn sm"+(p.sin_stock?" xg":"")} onClick={()=>upd(p,{sin_stock:!p.sin_stock},p.sin_stock?"Con stock de nuevo":"Marcado sin stock")}>{p.sin_stock?"Hay stock":"Sin stock"}</button>
        <button className="ib" aria-label="Subir" title="Subir" disabled={i===0} onClick={()=>move(p,-1)}><Ic n="up"/></button>
        <button className="ib dn" aria-label="Bajar" title="Bajar" disabled={i===list.length-1} onClick={()=>move(p,1)}><Ic n="up"/></button>
        <button className="ib" aria-label="Duplicar" title="Duplicar" onClick={()=>dup(p)}><Ic n="copy"/></button>
        <button className="btn sm xr" onClick={()=>del(p)}><Ic n="del"/>Eliminar</button>
      </div>
      <div className="cc-w">
        <button className="btn sm" onClick={()=>copyImg(p,rate,toast)}><Ic n="copy"/>Copiar imagen <span className="mut">(después pegala en WhatsApp)</span></button>
        {[1,2,3].map(n=><button key={n} className="btn sm" onClick={()=>copyText(msgCat(p,rate,n,ocStock),toast,"Mensaje "+n+" copiado")}><Ic n="wa"/>Mensaje {n}</button>)}
      </div></div>;
  };

  const Mini=({p})=>{
    const c=costoUsd(p,rate),r=reglasDe(rg,p.categoria),cv=r.moneda==="ARS"?(p.costo_ars!=null?Math.round(p.costo_ars):(c&&rate?Math.round(c*rate):"")):(c||"");

const PERIODOS=[["hoy","Hoy"],["semana","Esta semana"],["mes","Este mes"],["mes_ant","Mes anterior"],["anio","Este año"],["todo","Todo"]];
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const r2=x=>Math.round((Number(x)+Number.EPSILON)*100)/100;
const must=async q=>{const {data,error}=await q;if(error)throw error;return data};
const dmy=s=>{const [y,m,d]=String(s).slice(0,10).split("-");return `${d}/${m}/${y}`};
const saldoOf=v=>Math.max(0,r2(Number(v.total_usdt)-Number(v.pagado_usdt)));
/* importe en la moneda en que se cobró la venta */
const inCur=(v,u)=>v.moneda==="ARS"&&Number(v.cotizacion)>0?ars(u*Number(v.cotizacion))+" ARS":usd(u);
function periodRange(k){
  const n=new Date(),Y=n.getFullYear(),M=n.getMonth(),D=n.getDate();
  if(k==="hoy") return [ymd(n),ymd(n)];
  if(k==="semana"){const dow=(n.getDay()+6)%7;return [ymd(new Date(Y,M,D-dow)),ymd(new Date(Y,M,D-dow+6))]}
  if(k==="mes") return [ymd(new Date(Y,M,1)),ymd(new Date(Y,M+1,0))];
  if(k==="mes_ant") return [ymd(new Date(Y,M-1,1)),ymd(new Date(Y,M,0))];
  if(k==="anio") return [`${Y}-01-01`,`${Y}-12-31`];
  return ["0000-01-01","9999-12-31"];
}
/* Calcula cómo cambia el inventario al vender (sign=-1) o al anular una venta (sign=+1) */
function stockPatches(products,items,sign){
  const out=new Map();
  for(const it of items){
    if(!it.producto_id) continue;
    const p=products.find(x=>x.id===it.producto_id);if(!p) continue;
    const cur=out.get(p.id)||{stock:p.stock,variantes:(p.variantes||[]).map(v=>({...v})),imeis:[...(p.imeis||[])]};
    const q=Number(it.cantidad)*sign;
    if(it.variante){
      const v=cur.variantes.find(x=>same(x.color,it.variante.color)&&same(x.talle,it.variante.talle));
      if(v) v.stock=Math.max(0,(Number(v.stock)||0)+q); else if(sign>0) cur.variantes.push({...it.variante,stock:q});
      cur.stock=cur.variantes.reduce((s,v)=>s+(Number(v.stock)||0),0);
    }else if(cur.stock!==null&&cur.stock!==undefined){cur.stock=Math.max(0,Number(cur.stock)+q)}
    const im=it.imeis||[];
    if(im.length) cur.imeis=sign<0?cur.imeis.filter(x=>!im.includes(x)):[...new Set([...cur.imeis,...im])];
    out.set(p.id,cur);
  }
  return out;
}
async function applyPatches(patches){
  let failed=0;
  for(const [id,pt] of patches){
    let {error}=await db.rpc("panel_ajustar_stock",{p_id:id,p_stock:pt.stock===undefined?null:pt.stock,p_variantes:pt.variantes,p_imeis:pt.imeis});
    if(error) ({error}=await db.from("productos").update(pt).eq("id",id)); /* base sin actualizar: intento directo (solo admin) */
    if(error) failed++;
  }
  return failed;
}

/* Registrar un cobro sobre una venta con saldo */
function PayModal({v,onClose,onSaved,toast}){
  const sal=saldoOf(v),isArs=v.moneda==="ARS"&&Number(v.cotizacion)>0,cot=Number(v.cotizacion)||1;
  const toCur=u=>isArs?Math.round(u*cot):r2(u);
  const [m,setM]=useState(""),[busy,setBusy]=useState(false);
  const amountU=isArs?num(m)/cot:num(m);
  const save=async()=>{
    if(!(amountU>0)) return toast("Poné el monto que paga",1);
    setBusy(true);
    const nuevo=r2(Math.min(Number(v.total_usdt),Number(v.pagado_usdt)+amountU));
    const {error}=await db.from("ventas").update({pagado_usdt:nuevo}).eq("id",v.id);setBusy(false);
    if(error) return toast("No se pudo registrar el pago: "+error.message,1);
    toast(Number(v.total_usdt)-nuevo<0.005?"Venta cobrada por completo":"Pago registrado");onSaved();onClose();
  };
  return <Modal title={`Cobrar venta #${v.numero} · ${v.cliente_nombre}`} onClose={onClose}
    foot={<><button className="btn" onClick={onClose}>Cancelar</button><button className="btn p" onClick={save} disabled={busy}>Registrar pago</button></>}>
    <div className="g3">
      <div><div className="lbl">Total</div><b>{inCur(v,Number(v.total_usdt))}</b></div>
      <div><div className="lbl">Cobrado</div><b className="g">{inCur(v,Number(v.pagado_usdt))}</b></div>
      <div><div className="lbl">Saldo</div><b style={{color:"var(--red)"}}>{inCur(v,sal)}</b></div></div>
    {v.nota&&<p className="mut">Nota: {v.nota}</p>}
    <div className="f"><label>Monto que paga ({isArs?"ARS":"USD"})</label>
      <div style={{display:"flex",gap:8}}><input className="inp" autoFocus inputMode="decimal" value={m} onChange={e=>setM(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()}/>
        <button className="btn" onClick={()=>setM(String(toCur(sal)))}>Paga todo el saldo</button></div></div>
  </Modal>;
}

function Ventas({ventas,ventasOk,clients,products,cats,vendedores,rate,perfil,reload,toast}){
  const [per,setPer]=useState("mes"),[q,setQ]=useState(""),[unsent,setUnsent]=useState(false),[form,setForm]=useState(false),[openId,setOpenId]=useState(null),[pay,setPay]=useState(null);
  const fileRef=useRef();
  const adm=!perfil||perfil.rol==="admin";const [from,to]=periodRange(per);
  const inP=ventas.filter(v=>v.fecha>=from&&v.fecha<=to);
  const list=inP.filter(v=>(!unsent||!v.enviado)&&(!q||`${v.cliente_nombre} ${v.cliente_dni}`.toLowerCase().includes(q.toLowerCase())));
  const noEnv=ventas.filter(v=>!v.enviado).length;
  const vname=v=>(vendedores.find(x=>x.id===v.vendedor_id)||{}).nombre||"";
  const cotOf=v=>Number(v.cotizacion)||Number(rate)||0;
  const sum=f=>inP.reduce((s,v)=>s+f(v),0);
  const brutaU=sum(v=>Number(v.total_usdt)-Number(v.costo_usdt)), comU=sum(v=>Number(v.comision_usdt)), factU=sum(v=>Number(v.total_usdt));
  const brutaA=sum(v=>(Number(v.total_usdt)-Number(v.costo_usdt))*cotOf(v)), comA=sum(v=>Number(v.comision_usdt)*cotOf(v)), factA=sum(v=>Number(v.total_ars));
  const perLabel=(PERIODOS.find(p=>p[0]===per)||[])[1];

  const toggleEnv=async v=>{const {error}=await db.from("ventas").update({enviado:!v.enviado}).eq("id",v.id);error?toast("No se pudo actualizar",1):reload()};
  const del=async v=>{
    if(!confirm(`¿Eliminar la venta #${v.numero}? Los productos vuelven al stock del inventario.`))return;
    try{
      const failed=await applyPatches(stockPatches(products,v.venta_items||[],+1));
      await must(db.from("ventas").delete().eq("id",v.id));
      toast("Venta eliminada"+(failed?` · no se pudo devolver el stock de ${failed} producto(s)`:""),failed?1:0);reload();
    }catch(e){toast("No se pudo eliminar: "+e.message,1)}
  };

  const exportXlsx=()=>{
    if(!window.XLSX) return toast("No cargó el generador de Excel (revisá tu conexión)",1);
    const rows=[];
    list.forEach(v=>(v.venta_items||[]).forEach(i=>rows.push({"N°":v.numero,"Fecha":dmy(v.fecha),"Cliente":v.cliente_nombre,"DNI":v.cliente_dni,"Método de pago":v.metodo_pago,
      "Producto":i.nombre,"IMEI":(i.imeis||[]).join(", "),"Cantidad":i.cantidad,"Precio unit. USDT":Number(i.precio_usdt),"Subtotal USDT":r2(i.cantidad*i.precio_usdt),
      "Costo unit. USDT":Number(i.costo_usdt),"Ganancia USDT":r2(i.cantidad*(i.precio_usdt-i.costo_usdt)),"Moneda de cobro":v.moneda,"Total venta USDT":Number(v.total_usdt),
      "Total venta ARS":Number(v.total_ars),"Cobrado USDT":Number(v.pagado_usdt),"Saldo USDT":saldoOf(v),"Vendedor":vname(v),"Comisión USDT":Number(v.comision_usdt),
      "Meta Ads":v.meta_ads?"Sí":"No","Enviado":v.enviado?"Sí":"No","Nota":v.nota})));
    if(!rows.length) return toast("No hay ventas para descargar",1);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Ventas");
    XLSX.writeFile(wb,`ventas-${ymd(new Date())}.xlsx`);toast("Excel descargado");
  };

  /* Importar ventas desde Excel/CSV (una fila por producto; se agrupan por fecha + cliente + DNI). No toca el stock. */
  const importFile=async e=>{
    const file=e.target.files[0];e.target.value="";if(!file)return;
    try{
      if(!window.XLSX) throw new Error("No cargó el lector de Excel");
      const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const nk=k=>String(k).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
      const get=(r,keys)=>{for(const k of Object.keys(r)){const n=nk(k);if(keys.some(x=>n.includes(x)))return r[k]}return ""};
      const toDate=v=>{
        if(v instanceof Date){const d=new Date(v.getTime()+12*36e5);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`}
        const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
        if(m)return `${m[3].length===2?"20"+m[3]:m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
        m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:ymd(new Date())};
      const groups=new Map();let skipped=0;
      rows.forEach(r=>{
        const nombre=String(get(r,["producto","articulo","item"])).trim(),cant=Math.round(num(get(r,["cant"]))),precio=num(get(r,["precio"]));
        if(!nombre||!(cant>0)){skipped++;return}
        const fecha=toDate(get(r,["fecha"])),cliente=String(get(r,["cliente","nombre"])).trim(),dni=digits(get(r,["dni"]));
        const key=`${fecha}|${cliente.toLowerCase()}|${dni}`;
        const g=groups.get(key)||{fecha,cliente,dni,metodo:String(get(r,["metodo","mediodepago","formadepago"])).trim(),items:[]};
        g.items.push({nombre,cantidad:cant,precio,costo:num(get(r,["costo"]))});groups.set(key,g)});
      if(!groups.size) return toast("No encontré ventas (necesita columnas: Fecha, Cliente, Producto, Cantidad, Precio)",1);
      const cot=Number(rate)||0,arr=[...groups.values()];
      const ventasRows=arr.map(g=>{const tot=g.items.reduce((s,i)=>s+i.cantidad*i.precio,0),cos=g.items.reduce((s,i)=>s+i.cantidad*i.costo,0);
        const cli=g.dni?clients.find(c=>c.dni===g.dni):null;
        return {fecha:g.fecha,cliente_id:cli?cli.id:null,cliente_nombre:g.cliente||(cli?cli.nombre:""),cliente_dni:g.dni,metodo_pago:g.metodo,moneda:"USD",cotizacion:cot,
          total_usdt:r2(tot),total_ars:Math.round(tot*cot),costo_usdt:r2(cos),comision_usdt:0,pagado_usdt:r2(tot),enviado:true,nota:"Importada desde Excel"}});
      const created=await must(db.from("ventas").insert(ventasRows).select("id"));
      const itemRows=created.flatMap((c,k)=>arr[k].items.map(i=>({venta_id:c.id,nombre:i.nombre,cantidad:i.cantidad,precio_usdt:i.precio,precio_ars:Math.round(i.precio*cot),costo_usdt:i.costo,manual:true})));
      await must(db.from("venta_items").insert(itemRows));
      toast(`Se importaron ${created.length} ventas (${itemRows.length} productos)${skipped?` · ${skipped} filas omitidas`:""}`);reload();
    }catch(err){toast("No se pudo importar: "+(err.message||err),1)}
  };

  const K=({t,v,s,ic,c,hl})=><div className="kpi" style={{"--c":c,...(hl?{borderColor:"#14582f",boxShadow:"0 0 24px rgba(34,214,122,.08)"}:null)}}><h4><i><Ic n={ic}/></i>{t}</h4><div className="v">{v}</div><small>{s}</small></div>;

  if(!ventasOk) return <div className="box"><h3><Ic n="warn"/>Falta actualizar la base de datos</h3>
    <p className="s">Ejecutá de nuevo <b>supabase.sql</b> completo en Supabase &gt; SQL Editor (es seguro y no borra nada). Después recargá esta página.</p></div>;

  return <>
    {adm&&<div className="kpis kpis5">
      <K hl t="Mi ganancia neta" v={`${ars(brutaA-comA)} ARS`} s={`Bruta - comisiones · ${usd(brutaU-comU)}`} ic="cash" c="var(--green)"/>
      <K t="Ganancia bruta" v={`${ars(brutaA)} ARS`} s={`Precio - costo · ${usd(brutaU)}`} ic="chart" c="var(--green)"/>
      <K t="Comisiones vendedores" v={`${ars(comA)} ARS`} s={`Del período · ${usd(comU)}`} ic="user" c="var(--gold)"/>
      <K t="Total facturado" v={`${ars(factA)} ARS`} s={`${perLabel} · ${usd(factU)}`} ic="wallet" c="var(--blue)"/>
      <K t="Ventas registradas" v={inP.length} s={inP.length?"En el período":"Sin ventas"} ic="list" c="var(--violet)"/>
    </div>}

    <div className="vtool">
      <label className="per"><Ic n="cal"/><select className="sel" value={per} onChange={e=>setPer(e.target.value)} aria-label="Período">{PERIODOS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></label>
      <input className="inp vsearch" placeholder="Buscar por cliente o DNI…" value={q} onChange={e=>setQ(e.target.value)} aria-label="Buscar venta"/>
      <span className="sp"/>
      <button className={"btn warn"+(unsent?" act":"")} aria-pressed={unsent} onClick={()=>setUnsent(!unsent)}><Ic n="pkg"/>No enviados ({noEnv})</button>
      <button className="btn gr" onClick={exportXlsx}><Ic n="dl"/>Descargar Excel</button>
      {adm&&<button className="btn gr" onClick={()=>fileRef.current.click()} title="Columnas: Fecha, Cliente, DNI, Producto, Cantidad, Precio, Costo, Método de pago"><Ic n="up"/>Importar Excel</button>}
      <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" hidden onChange={importFile}/>
      <button className="btn p big" onClick={()=>{setForm(true);window.scrollTo(0,0)}}><span className="plusb"><Ic n="plus"/></span>Registrar venta</button>
    </div>

    {form&&<VentaForm clients={clients} products={products} cats={cats} vendedores={vendedores} rate={rate} perfil={perfil} onClose={()=>setForm(false)} onSaved={reload} toast={toast}/>}

    {ventas.length===0&&!form?<div className="empty-c" style={{padding:"90px 0"}}><div className="dollar">$</div><b>No hay ventas registradas</b>Registrá tu primera venta
      <div style={{marginTop:16}}><button className="btn p" onClick={()=>setForm(true)}><Ic n="plus"/>Registrar venta</button></div></div>
    :list.length===0?<p className="emp">No hay ventas con estos filtros</p>
    :<div className="tw"><table>
      <thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Pago</th><th>Total</th>{adm&&<th>Ganancia</th>}<th>Cobro</th><th>Enviado</th><th></th></tr></thead>
      <tbody>{list.flatMap(v=>{const its=v.venta_items||[],sal=saldoOf(v),gan=Number(v.total_usdt)-Number(v.costo_usdt)-Number(v.comision_usdt);return [
        <tr key={v.id}>
          <td><b className="g">#{v.numero}</b></td><td className="mut" style={{whiteSpace:"nowrap"}}>{dmy(v.fecha)}</td>
          <td><b>{v.cliente_nombre||"—"}</b><div className="mut" style={{fontSize:11}}>{v.cliente_dni?`DNI ${v.cliente_dni}`:""}{v.meta_ads&&" · Meta Ads"}</div></td>
          <td>{its[0]?its[0].nombre:"—"}{its.length>1&&<span className="mut"> +{its.length-1} más</span>}<div className="mut" style={{fontSize:11}}>{its.reduce((s,i)=>s+i.cantidad,0)} u.{vname(v)&&` · ${vname(v)}`}</div></td>
          <td className="mut">{v.metodo_pago||"—"}</td>
          <td><b>{inCur(v,Number(v.total_usdt))}</b><div className="au" style={{fontSize:11}}>{v.moneda==="ARS"?usd(v.total_usdt):`${ars(v.total_ars)}`}</div></td>
          {adm&&<td><b className={gan>=0?"g":""} style={gan<0?{color:"var(--red)"}:null}>{usd(gan)}</b></td>}
          <td>{sal>0?<><span className="pill st-cancelado">Debe {inCur(v,sal)}</span>{adm&&<div><button className="btn" style={{padding:"4px 10px",fontSize:11,marginTop:5}} onClick={()=>setPay(v)}>Cobrar</button></div>}</>:<span className="pill st-entregado">Cobrada</span>}</td>
          <td><button className={"sw"+(v.enviado?" on":"")} role="switch" aria-checked={v.enviado} aria-label={`Venta ${v.numero} enviada`} disabled={!adm} onClick={()=>toggleEnv(v)}/></td>
          <td><div className="acts"><button className="ib" aria-label="Ver detalle" onClick={()=>setOpenId(openId===v.id?null:v.id)}><Ic n="eye"/></button>
            {adm&&<button className="ib d" aria-label="Eliminar venta" onClick={()=>del(v)}><Ic n="del"/></button>}</div></td></tr>,
        openId===v.id&&<tr className="det" key={v.id+"d"}><td colSpan="10">
          {v.nota&&<p style={{marginBottom:10}}><b>Nota:</b> {v.nota}</p>}
          <table><thead><tr><th>Producto</th><th>Cant.</th><th>Precio u.</th><th>Costo u.</th><th>Subtotal</th><th>Ganancia</th></tr></thead><tbody>
            {its.map(i=><tr key={i.id}><td>{i.nombre}{(i.imeis||[]).length>0&&<div className="mut" style={{fontSize:11}}>IMEI {i.imeis.join(", ")}</div>}</td><td>{i.cantidad}</td>
              <td>{usd(i.precio_usdt)} <span className="au">{ars(i.precio_ars)}</span></td><td>{usd(i.costo_usdt)}</td><td><b>{usd(i.cantidad*i.precio_usdt)}</b></td>
              <td className="g">{usd(i.cantidad*(i.precio_usdt-i.costo_usdt))}</td></tr>)}</tbody></table>
          <p className="mut" style={{marginTop:10}}>Cotización de la venta: {ars(v.cotizacion)} · Costo {usd(v.costo_usdt)} · Comisión {usd(v.comision_usdt)} · Cobrado {inCur(v,Number(v.pagado_usdt))}</p></td></tr>].filter(Boolean)})}
      </tbody></table></div>}
    {pay&&<PayModal v={pay} onClose={()=>setPay(null)} onSaved={reload} toast={toast}/>}
  </>;
}

/* =====================  HERRAMIENTAS · helpers  ===================== */
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const ymNow=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`};
const ymLabel=ym=>{const [y,m]=ym.split("-");return `${MESES[+m-1]} ${y}`};
const ymAdd=(ym,d)=>{const [y,m]=ym.split("-").map(Number);const t=new Date(y,m-1+d,1);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}`};
const ud=n=>"U$D "+Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:2});
const GASTO_CATS=[{k:"otros",l:"Otros",i:"🧾"},{k:"alquiler",l:"Alquiler",i:"🏠"},{k:"servicios",l:"Servicios",i:"💡"},{k:"sueldos",l:"Sueldos",i:"👥"},
  {k:"publicidad",l:"Publicidad",i:"📣"},{k:"envios",l:"Envíos",i:"📦"},{k:"combustible",l:"Nafta / viajes",i:"⛽"},{k:"impuestos",l:"Impuestos",i:"🏛️"},
  {k:"insumos",l:"Insumos / librería",i:"🛠️"},{k:"comida",l:"Comida",i:"🍽️"}];
const catOf=k=>GASTO_CATS.find(c=>c.k===k)||GASTO_CATS[0];

/* Gastos de un mes (YYYY-MM): fijos que corresponden a ese mes + gastos sueltos. Todo en USD. */
function gastosMes(M,{fijos,pagos,gastos,rate}){
  const toUsd=(m,mon)=>mon==="USD"?Number(m):(rate?Number(m)/rate:0);
  const fl=fijos.filter(f=>f.desde_mes<=M&&(!f.baja_mes||M<f.baja_mes))
    .map(f=>({...f,usd:toUsd(f.monto,f.moneda),pagado:pagos.some(p=>p.fijo_id===f.id&&p.mes===M)}));
  const sl=gastos.filter(g=>String(g.fecha).slice(0,7)===M);
  const fijosUsd=fl.reduce((s,f)=>s+f.usd,0),pagadoUsd=fl.filter(f=>f.pagado).reduce((s,f)=>s+f.usd,0);
  const sueltosUsd=sl.reduce((s,g)=>s+Number(g.monto_usdt),0);
  const cats={};
  fl.forEach(f=>{cats[f.categoria]=(cats[f.categoria]||0)+f.usd});sl.forEach(g=>{cats[g.categoria]=(cats[g.categoria]||0)+Number(g.monto_usdt)});
  return {fl,sl,fijosUsd,pagadoUsd,faltaUsd:fijosUsd-pagadoUsd,sueltosUsd,total:fijosUsd+sueltosUsd,cats};
}

function FijosModal({fijos,ym,rate,onClose,reload,toast}){

  const add=async()=>{
    if(!f.nombre.trim()) return toast("Poné el nombre del gasto fijo",1);
    if(!(num(f.monto)>0)) return toast("Poné el monto",1);
    setBusy(true);
    const {error}=await db.from("gastos_fijos").insert({nombre:f.nombre.trim(),monto:num(f.monto),moneda:f.mon,categoria:f.cat,
      dia:f.dia?Math.min(31,Math.max(1,Math.round(num(f.dia)))):null,desde_mes:ym});
    setBusy(false);
    if(error) return toast("No se pudo guardar: "+error.message,1);
    setF({...f,nombre:"",monto:"",dia:""});toast("Gasto fijo agregado");reload();
  };

  const del=async x=>{if(!confirm(`¿Eliminar “${x.nombre}” de todos los meses? Si solo querés que deje de generarse, usá “Dar de baja”.`))return;

      <div className="mseg"><button type="button" className={f.mon==="ARS"?"on":""} onClick={()=>setF({...f,mon:"ARS"})}>$ Pesos</button><button type="button" className={f.mon==="USD"?"on":""} onClick={()=>setF({...f,mon:"USD"})}>USD</button></div>
      <select className="sel" value={f.cat} onChange={e=>setF({...f,cat:e.target.value})} aria-label="Categoría">{GASTO_CATS.map(c=><option key={c.k} value={c.k}>{c.i} {c.l}</option>)}</select>
      <input className="inp" placeholder="Vence el día" inputMode="numeric" value={f.dia} onChange={e=>setF({...f,dia:e.target.value.replace(/\D/g,"")})} aria-label="Día de vencimiento"/>

    :<div className="tw"><table><thead><tr><th>Gasto</th><th>Monto</th><th>Desde</th><th>Estado</th><th></th></tr></thead><tbody>
      {fijos.map(x=><tr key={x.id} style={x.baja_mes?{opacity:.6}:null}>

        <td><div style={{display:"flex",gap:6,alignItems:"center"}}><input className="inp" style={{padding:"7px 9px",width:110}} inputMode="decimal" defaultValue={x.monto} aria-label="Monto"

function Gastos({gastos,fijos,pagos,rate,reload,toast,toolsOk}){
  const [ym,setYm]=useState(ymNow()),[fm,setFm]=useState(false);
  const [f,setF]=useState({concepto:"",monto:"",mon:"ARS",cat:"otros",fecha:ymd(new Date())});
  useEffect(()=>{setF(x=>({...x,fecha:ym===ymNow()?ymd(new Date()):`${ym}-01`}))},[ym]);
  if(!toolsOk) return <NeedSql/>;
  const ctx={fijos,pagos,gastos,rate};
  const g=gastosMes(ym,ctx),prev=gastosMes(ymAdd(ym,-1),ctx);
  const mes=MESES[+ym.split("-")[1]-1];
  const cmp=prev.total>0?`${g.total>=prev.total?"▲":"▼"} ${Math.abs(Math.round((g.total-prev.total)/prev.total*100))}% vs mes anterior`:"sin datos del mes anterior";
  const aArs=u=>rate?`≈ ${ars(u*rate)} ARS`:"";
  const top=Object.entries(g.cats).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const activos=fijos.filter(x=>!x.baja_mes),mensual=activos.reduce((s,x)=>s+(x.moneda==="USD"?Number(x.monto):(rate?Number(x.monto)/rate:0)),0);

  const add=async()=>{
    const m=num(f.monto);
    if(!f.concepto.trim()) return toast("Contá en qué gastaste",1);
    if(!(m>0)) return toast("Poné el monto",1);
    if(f.mon==="ARS"&&!rate) return toast("Esperando la cotización del dólar…",1);
    const {error}=await db.from("gastos").insert({concepto:f.concepto.trim(),monto:m,moneda:f.mon,monto_usdt:r2(f.mon==="USD"?m:m/rate),cotizacion:rate||0,categoria:f.cat,fecha:f.fecha});
    if(error) return toast("No se pudo guardar: "+error.message,1);
    setF({...f,concepto:"",monto:""});toast("Gasto agregado");reload();
  };
  const delG=async x=>{if(!confirm(`¿Eliminar el gasto “${x.concepto}”?`))return;const {error}=await db.from("gastos").delete().eq("id",x.id);error?toast("No se pudo eliminar",1):(toast("Gasto eliminado"),reload())};
  const togglePago=async x=>{
    const {error}=x.pagado?await db.from("gastos_fijos_pagos").delete().eq("fijo_id",x.id).eq("mes",ym):await db.from("gastos_fijos_pagos").insert({fijo_id:x.id,mes:ym});
    error?toast("No se pudo actualizar",1):(toast(x.pagado?"Marcado como pendiente":`“${x.nombre}” pagado`),reload());
  };
  const fmtM=(m,mon)=>mon==="USD"?ud(m):`${ars(m)} ARS`;

  return <>
    <div className="gh2"><div><h2>Gastos</h2><p>Fijos de todos los meses + gastos sueltos. Todo resta en tu Ganancia Neta.</p></div>
      <div className="mnav"><button className="ib" onClick={()=>setYm(ymAdd(ym,-1))} aria-label="Mes anterior">‹</button><b>{ymLabel(ym)}</b>
        <button className="ib" onClick={()=>setYm(ymAdd(ym,1))} aria-label="Mes siguiente">›</button></div></div>

    <div className="gks">
